<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F5F2EE">
<meta name="mobile-web-app-capable" content="yes">
<title>Bengkel SKL</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<!-- The truck diagram, shared with the office dashboard (one definition). -->
<script src="https://skl-ops.ptmercusuar.com/static/truck-diagram/spec.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<!--
  Mechanic app, redesigned 2026-09-24 (canvas: claude.ai/artifact/QsyKkNTwVcYbPgEzBK6CFC).
  ONE page, two ways in:
   - phone: opened from SKL_Lapangan_bot in Telegram; identity = Telegram;
   - workshop tablet (Android, landscape): opened in the browser; the tablet
     is registered once (#setup=<key>), then each mechanic picks their name
     and enters a 4-digit PIN. It locks itself after 2 minutes untouched.
  This file is the source of truth for the page (the PAGE constant in
  os/driver-bot/.../mekanik-miniapp had drifted behind it).
  Theme = the SKL apps' own: #F5F2EE paper, #8B1A1A oxblood, Fraunces/Inter/
  JetBrains Mono; issue colours from the dispatcher app, truck-state colours
  from skl-route-agent's dashboard STATE_COLOR.
-->
<style>
:root {
  --bg: #F5F2EE; --surface: #FFFFFF; --surface2: #F0EBE4; --surface3: #E5DDD3;
  --text: #2B2420; --muted: #7A6F63; --dim: #B0A594; --border: #E2D9CC;
  --accent: #8B1A1A; --accent-hover: #6E1414; --accent-dim: #F3E3E3;
  --green: #1E8449; --green-dim: #E1F0E6; --amber: #9A5B0A; --amber-dim: #FCEFD8; --red: #B91C1C;
  --display: 'Fraunces', Georgia, serif; --sans: 'Inter', system-ui, sans-serif; --mono: 'JetBrains Mono', ui-monospace, monospace;
  --r: 14px; --tap: 52px;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; background: var(--bg); color: var(--text); font-family: var(--sans); font-size: 16px; -webkit-font-smoothing: antialiased; }
body { min-height: 100vh; overscroll-behavior-y: none; }
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; border: 0; background: none; padding: 0; }
button:disabled { opacity: .45; cursor: default; }
a { color: var(--accent); }
.mono { font-family: var(--mono); }
.hidden { display: none !important; }

/* ---------- shared pieces ---------- */
.large-title { font-family: var(--display); font-weight: 600; letter-spacing: -0.01em; font-size: 34px; line-height: 1.1; margin: 0; }
.eyebrow { font-size: 12px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); padding: 0 4px; }
.sub { font-size: 14px; color: var(--muted); }
.group { background: var(--surface); border-radius: var(--r); overflow: hidden; }
.row { display: flex; align-items: center; gap: 12px; min-height: 64px; padding: 10px 16px; width: 100%; text-align: left; background: var(--surface); position: relative; }
.row + .row::before { content: ""; position: absolute; top: 0; left: 16px; right: 0; height: 1px; background: var(--border); }
.row.indent + .row.indent::before { left: 70px; }
.row.selected { background: var(--accent-dim); }
.row .grow { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.row .title { font-size: 16px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; }
.row .meta { font-size: 13px; color: var(--muted); }
.truck-num { font-family: var(--display); font-weight: 600; font-size: 26px; width: 44px; flex-shrink: 0; }
.chev { width: 9px; height: 16px; flex-shrink: 0; }
.pill { display: inline-flex; align-items: center; padding: 4px 10px; border-radius: 10px; font-size: 12px; font-weight: 600; white-space: nowrap; }
.st-neutral { background: var(--surface2); color: var(--muted); }
.st-amber { background: var(--amber-dim); color: var(--amber); }
.st-work { background: var(--accent-dim); color: var(--accent); }
.st-done { background: var(--green-dim); color: var(--green); }
.dot { width: 10px; height: 10px; border-radius: 5px; flex-shrink: 0; }
.btn { display: flex; align-items: center; justify-content: center; gap: 8px; min-height: var(--tap); padding: 0 20px; border-radius: var(--r); font-size: 17px; font-weight: 600; text-decoration: none; }
.btn-primary { background: var(--accent); color: #fff; }
.btn-primary:active { background: var(--accent-hover); }
.btn-green { background: var(--green); color: #fff; }
.btn-dark { background: var(--text); color: #fff; }
.btn-soft { background: var(--surface2); color: var(--text); }
.btn-plain { background: var(--surface); color: var(--accent); }
.btn-block { width: 100%; }
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); padding: 3px; border-radius: 11px; background: var(--surface3); }
.seg button { min-height: 40px; border-radius: 9px; font-size: 15px; font-weight: 500; color: var(--muted); padding: 0 8px; }
.seg button.on { background: var(--surface); color: var(--text); font-weight: 600; box-shadow: 0 1px 3px rgba(43,36,32,.12); }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { min-height: 48px; padding: 0 16px; border-radius: 12px; background: var(--surface); font-size: 16px; font-weight: 600; }
.chip.on { background: var(--accent); color: #fff; }
.chip.num { font-family: var(--display); font-size: 22px; min-width: 64px; }
.empty-note { padding: 24px 16px; text-align: center; color: var(--muted); font-size: 15px; }
.stack { display: flex; flex-direction: column; gap: 10px; }
.hint { font-size: 14px; color: var(--muted); line-height: 1.45; }
textarea.field, input.field { width: 100%; border: 0; border-radius: var(--r); background: var(--surface); padding: 14px 16px; font-size: 16px; min-height: 52px; }
textarea.field { min-height: 88px; resize: vertical; }
.suggest { display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-radius: 12px; background: var(--amber-dim); color: var(--amber); font-size: 14px; }
.suggest button { margin-left: auto; font-weight: 700; color: var(--amber); min-height: 40px; padding: 0 8px; }

/* ---------- app shell ---------- */
#app { min-height: 100vh; display: flex; flex-direction: column; }
.topbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 16px 20px 8px; }
.me-chip { display: flex; align-items: center; gap: 10px; min-height: 48px; padding: 0 14px 0 6px; border-radius: 24px; background: var(--surface); font-size: 15px; font-weight: 600; }
.avatar { display: inline-flex; align-items: center; justify-content: center; width: 36px; height: 36px; border-radius: 18px; background: var(--accent); color: #fff; font-family: var(--display); font-weight: 600; }
.avatar.alt { background: var(--surface3); color: var(--text); }
.split { flex: 1; display: grid; grid-template-columns: 400px minmax(0, 1fr); min-height: 0; }
.side { background: var(--surface2); border-right: 1px solid var(--border); display: flex; flex-direction: column; gap: 14px; padding: 20px 16px 24px; overflow-y: auto; height: 100vh; position: sticky; top: 0; }
.main { padding: 20px 32px 32px; display: flex; flex-direction: column; gap: 18px; min-width: 0; }
.narrow-body { flex: 1; padding: 8px 16px 110px; display: flex; flex-direction: column; gap: 14px; }
.tabbar { position: fixed; left: 0; right: 0; bottom: 0; display: grid; grid-template-columns: repeat(3, 1fr); background: rgba(255,255,255,.96); backdrop-filter: blur(12px); border-top: 1px solid var(--border); padding-bottom: env(safe-area-inset-bottom); z-index: 20; }
.tabbar button { display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 10px 0 12px; font-size: 12px; font-weight: 600; color: var(--muted); position: relative; }
.tabbar button.on { color: var(--accent); }
.badge { position: absolute; top: 4px; left: calc(50% + 6px); min-width: 20px; height: 20px; border-radius: 10px; background: var(--accent); color: #fff; font-size: 12px; display: flex; align-items: center; justify-content: center; padding: 0 6px; }
.navback { display: inline-flex; align-items: center; gap: 6px; min-height: 44px; font-size: 17px; color: var(--accent); }
.normal-list { display: flex; flex-direction: column; gap: 10px; padding: 14px 16px; border-radius: var(--r); background: var(--surface); font-size: 15px; }
.normal-list span { display: flex; align-items: center; gap: 10px; }
.normal-list b { width: 34px; }

/* ---------- truck detail ---------- */
.detail-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
.issue-card { background: var(--surface); border-radius: 16px; padding: 18px; display: flex; flex-direction: column; gap: 12px; }
.issue-card.work { box-shadow: inset 0 0 0 2px var(--accent); }
.issue-card.pending { opacity: .6; }
.issue-top { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.issue-title { font-family: var(--display); font-size: 24px; font-weight: 600; line-height: 1.2; margin: 0; }
.issue-desc { font-size: 15px; color: var(--muted); line-height: 1.45; }
.issue-actions { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.issue-actions .btn-primary, .issue-actions .btn-green, .issue-actions .full { grid-column: 1 / -1; min-height: 60px; font-size: 18px; }
.linkbtn { color: var(--accent); font-size: 15px; font-weight: 600; min-height: 40px; }
.repair-foot { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; padding: 14px 16px; border-radius: 16px; background: var(--surface); }
.repair-foot .hint { flex: 1; min-width: 200px; }
.two-col { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 16px; align-items: start; }

/* ---------- sheets ---------- */
.sheet-backdrop { position: fixed; inset: 0; background: rgba(43,36,32,.38); z-index: 40; display: flex; align-items: flex-end; justify-content: center; }
.sheet-backdrop.anim { animation: fade .18s ease; }
.sheet { width: min(1180px, 100%); height: calc(100% - 28px); background: var(--bg); border-radius: 22px 22px 0 0; display: flex; flex-direction: column; overflow: hidden; }
.sheet-backdrop.anim .sheet { animation: up .22s cubic-bezier(.2,.8,.2,1); }
.sheet-head { display: grid; grid-template-columns: 110px minmax(0, 1fr) 110px; align-items: center; min-height: 60px; padding: 0 18px; background: var(--surface); border-bottom: 1px solid var(--border); }
.sheet-head .t { text-align: center; font-size: 17px; font-weight: 600; }
.sheet-head button { justify-self: start; color: var(--accent); font-size: 17px; min-height: 44px; }
.sheet-body { flex: 1; overflow-y: auto; padding: 18px 20px 24px; }
.sheet-foot { padding: 12px 20px calc(16px + env(safe-area-inset-bottom)); background: var(--surface); border-top: 1px solid var(--border); display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
.sheet-foot .summary { flex: 1; min-width: 200px; font-size: 15px; color: var(--muted); }
.sheet-foot .summary b { color: var(--text); }
@keyframes up { from { transform: translateY(40px); opacity: 0; } to { transform: none; opacity: 1; } }
@keyframes fade { from { opacity: 0; } to { opacity: 1; } }
.lapor-grid { display: grid; grid-template-columns: minmax(0, 1.35fr) minmax(0, 1fr); gap: 22px; align-items: start; }

/* ---------- photo picker ---------- */
.crumbs { display: flex; align-items: center; gap: 8px; font-size: 15px; flex-wrap: wrap; min-height: 32px; }
.crumbs button { color: var(--accent); font-weight: 600; min-height: 32px; }
.crumbs .sep { color: var(--dim); }
.photo { position: relative; width: 100%; border-radius: 16px; overflow: hidden; background: var(--surface); }
.photo img { display: block; width: 100%; height: auto; user-select: none; -webkit-user-drag: none; }
.spot { position: absolute; transform: translate(-50%, -50%); display: inline-flex; align-items: center; gap: 6px; min-height: 40px; padding: 0 12px; border-radius: 20px; background: rgba(255,255,255,.95); box-shadow: 0 2px 8px rgba(43,36,32,.28); font-size: 14px; font-weight: 600; white-space: nowrap; }
.spot.zone { min-height: 44px; font-size: 15px; }
.spot.open { background: var(--accent); color: #fff; }
.spot.sel { outline: 3px solid var(--text); outline-offset: 1px; }
.photo.crackable img { cursor: crosshair; }
.crack { position: absolute; width: 16px; height: 16px; margin: -8px 0 0 -8px; border-radius: 50%; background: var(--accent); border: 2px solid #fff; box-shadow: 0 1px 4px rgba(43,36,32,.4); pointer-events: none; }
.pop.low { top: 76%; } .pop.high { top: 24%; }
.crack.new { width: 24px; height: 24px; margin: -12px 0 0 -12px; background: rgba(139,26,26,.35); border: 3px solid var(--accent); }
/* Pin: the dot sits exactly where the dashboard puts the part, the label
   floats above it on a short stem (lifted further when labels collide). */
.spot.pin { transform: translate(calc(-50% + var(--dx, 0px)), calc(-100% - 12px - var(--lift, 0px))); }
.spot.pin::before { content: ""; position: absolute; left: calc(50% - var(--dx, 0px)); top: 100%; width: 2px; margin-left: -1px; height: calc(8px + var(--lift, 0px)); background: rgba(43,36,32,.55); }
.spot.pin::after { content: ""; box-sizing: border-box; position: absolute; left: calc(50% - var(--dx, 0px)); top: calc(100% + 6px + var(--lift, 0px)); width: 12px; height: 12px; margin-left: -6px; border-radius: 50%; background: var(--accent); border: 2px solid #fff; box-shadow: 0 1px 3px rgba(43,36,32,.45); }
.spot.pin.below { transform: translate(calc(-50% + var(--dx, 0px)), 12px); }
.spot.pin.below::before { top: auto; bottom: 100%; height: 8px; }
.spot.pin.below::after { top: auto; bottom: calc(100% + 6px); }
.spot .n { display: inline-flex; align-items: center; justify-content: center; min-width: 22px; height: 22px; border-radius: 11px; background: #fff; color: var(--accent); font-size: 12px; font-weight: 700; }
.thumbs { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(112px, 1fr); gap: 8px; overflow-x: auto; padding-bottom: 2px; }
.thumb { display: flex; flex-direction: column; gap: 5px; padding: 5px; border-radius: 12px; background: var(--surface); text-align: left; }
.thumb img { width: 100%; height: 58px; object-fit: cover; border-radius: 8px; display: block; }
.thumb span { font-size: 13px; font-weight: 600; padding: 0 3px 2px; }
.thumb.on { box-shadow: inset 0 0 0 2px var(--accent); background: var(--accent-dim); color: var(--accent); }
.pop { position: absolute; z-index: 5; width: min(320px, 92%); left: 50%; top: 50%; transform: translate(-50%, -50%); background: var(--surface); border-radius: 18px; padding: 14px; box-shadow: 0 14px 36px rgba(43,36,32,.32); display: flex; flex-direction: column; gap: 8px; }
.pop .h { display: flex; align-items: center; justify-content: space-between; font-size: 16px; font-weight: 600; }
.pop .choice { min-height: 54px; padding: 0 16px; border-radius: 12px; background: var(--surface2); font-size: 16px; font-weight: 600; text-align: left; }

/* ---------- lock ---------- */
.lock { flex: 1; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); min-height: 100vh; }
.lock-left { display: flex; flex-direction: column; justify-content: center; gap: 30px; padding: 56px; }
.lock-right { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 28px; padding: 40px; background: var(--surface); }
.pin-dots { display: flex; gap: 22px; }
.pin-dots span { width: 18px; height: 18px; border-radius: 9px; border: 2px solid var(--dim); }
.pin-dots span.f { background: var(--text); border-color: var(--text); }
.pin-dots.shake { animation: shake .35s; }
@keyframes shake { 20%, 60% { transform: translateX(-10px); } 40%, 80% { transform: translateX(10px); } }
.pad { display: grid; grid-template-columns: repeat(3, 88px); gap: 16px 26px; }
.pad button { width: 88px; height: 88px; border-radius: 44px; background: var(--surface2); font-size: 34px; font-weight: 500; }
.pad button:active { background: var(--surface3); }
.pad .txt { background: transparent; font-size: 17px; font-weight: 600; color: var(--accent); }

/* ---------- toast ---------- */
#toast { position: fixed; left: 50%; bottom: calc(96px + env(safe-area-inset-bottom)); transform: translateX(-50%); z-index: 60; display: none; align-items: center; gap: 16px; max-width: calc(100% - 32px); padding: 12px 12px 12px 18px; border-radius: 14px; background: var(--text); color: #fff; font-size: 15px; box-shadow: 0 10px 30px rgba(43,36,32,.3); }
#toast.show { display: flex; }
#toast button { color: #F0B8B8; font-weight: 700; min-height: 40px; padding: 0 10px; }

/* ---------- narrow screens (phone, tablet portrait) ---------- */
@media (max-width: 899px) {
  .split { display: block; }
  .lock { grid-template-columns: 1fr; }
  .lock-left { padding: 32px 20px 8px; gap: 20px; }
  .lock-right { background: transparent; padding: 16px 20px 40px; }
  .pad { grid-template-columns: repeat(3, 76px); gap: 14px 22px; }
  .pad button { width: 76px; height: 76px; border-radius: 38px; font-size: 30px; }
  .lapor-grid, .two-col { grid-template-columns: 1fr; }
  .sheet { height: calc(100% - 12px); border-radius: 16px 16px 0 0; }
  .sheet-body { padding: 14px 16px 20px; }
  .issue-title { font-size: 21px; }
  .large-title { font-size: 30px; }
  .spot { min-height: 34px; padding: 0 9px; font-size: 12px; }
  .spot.zone { min-height: 36px; font-size: 13px; }
  /* The photo is ~200px tall on a phone -- the brake/wheel choice opens as a bottom sheet instead of over it. */
  .pop { position: fixed; left: 0; right: 0; top: auto; bottom: 0; transform: none; width: 100%; border-radius: 18px 18px 0 0; padding: 16px 16px calc(20px + env(safe-area-inset-bottom)); z-index: 50; }
  .pop.low, .pop.high { top: auto; }
  #toast { bottom: calc(86px + env(safe-area-inset-bottom)); }
}
/* Phone: the photo is too narrow for every label. Parts show as dots with
   a thumb-sized tap area; only the chosen one shows its name. The list
   under the photo names them all. */
@media (max-width: 599px) {
  .spot.pin:not(.sel) { width: 40px; height: 40px; min-height: 0; padding: 0; font-size: 0; background: transparent; box-shadow: none; transform: translate(-50%, -50%); justify-content: center; }
  .spot.pin:not(.sel)::before { display: none; }
  .spot.pin:not(.sel)::after { top: 50%; left: 50%; width: 16px; height: 16px; margin: -8px 0 0 -8px; }
  .spot.pin.open:not(.sel)::after { width: 22px; height: 22px; margin: -11px 0 0 -11px; }
  .spot.pin:not(.sel) .n { position: absolute; z-index: 1; top: 50%; left: 50%; transform: translate(-50%, -50%); min-width: 18px; height: 18px; font-size: 11px; background: transparent; color: #fff; }
}
@media (min-width: 900px) {
  .tabbar { display: none; }
  #toast { bottom: 28px; }
}
</style>
</head>
<body>
<div id="app"></div>
<div id="sheet-root"></div>
<div id="toast" role="status" aria-live="polite"><span id="toast-msg"></span><button id="toast-undo" class="hidden">Batalkan</button></div>
<input type="file" id="photo-input" accept="image/*,video/*" capture="environment" class="hidden">

<script>
"use strict";
// Production only, deliberately: no ?api= override. The tablet holds a device
// key and receives PINs, so a crafted link pointing the page at another
// server would hand both over.
// Run the function next to the database (Sydney) instead of nearest to the
// caller (Singapore): opening the app makes 4 DB trips in a row, and each is
// ~240 ms from Singapore vs ~40 ms in Sydney. Measured 2026-09-26: median
// init_data 1.6 s -> 1.3 s. A query parameter, not the x-region header, so
// the browser doesn't need an extra CORS preflight.
const API_URL = "https://kcftvbuwotjjroattdak.supabase.co/functions/v1/mekanik-api?forceFunctionRegion=ap-southeast-2";
const IMG_ORIGIN = "https://skl-ops.ptmercusuar.com";
// Spec paths are site-absolute ('/static/truck-diagram/x.jpg'); assetVersion
// busts the browser cache when an image is replaced in place.
const img = (f) => IMG_ORIGIN + (f.startsWith("/") ? f : "/static/truck-diagram/" + f) + "?v=" + ((window.SKL_TRUCK_DIAGRAM || {}).assetVersion || "0");
const tg = window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.initData ? window.Telegram.WebApp : null;
const DEMO = location.hash === "#demo";
const LOCK_AFTER_MS = 5 * 60 * 1000;
const UNDO_MS = 10 * 1000;
const DEVICE_KEY_STORE = "skl_mekanik_device_key";

// ---------- labels (kept in step with mekanik-api / dashboard / dispatcher) ----------
const LOCATION_LABELS = { pool: "Pool", storing_luar: "Storing", bengkel_luar: "Bengkel luar" };
const STATE_LABELS = { IN_TRANSIT: "Transit", UNLOADING: "Bongkar", LOADING: "Muat", QUEUING_PICKUP: "Muat", DECIDING: "Pilih rute", FERRY: "Ferry", WAITING_YARD: "Di Pool", IDLE_UNKNOWN: "Berhenti", UNDER_REPAIR: "Perbaikan", POSITIONING: "Menuju muat" };
const STATE_COLOR = { IN_TRANSIT: "#22C55E", LOADING: "#3B82F6", UNLOADING: "#3B82F6", QUEUING_PICKUP: "#3B82F6", DECIDING: "#D97706", FERRY: "#a78bfa", WAITING_YARD: "#0D9488", IDLE_UNKNOWN: "#4A5568", UNDER_REPAIR: "#EF4444", POSITIONING: "#22C55E" };
const ROUTINE_FM_NAMES = ["Ganti filter oli", "Ganti filter solar", "Ganti oli mesin", "Ganti minyak rem"];
// Routine items and their limits come from the service_items table (one
// list for this app, the dashboard and the service_due view, 2026-09-25).
// This is only the fallback if the backend sends none.
const ROUTINE_ITEMS_FALLBACK = [
  { type: "oli_mesin", label: "Oli mesin", unit: "liter", step: 1 },
  { type: "filter_oli", label: "Filter oli" },
  { type: "filter_solar_primer", label: "Filter solar primer" },
  { type: "filter_solar_utama", label: "Filter solar utama" },
  { type: "minyak_rem", label: "Minyak rem", unit: "ml", step: 100 },
  { type: "terpal", label: "Terpal" },
];
function routineItems() {
  const rows = S.data && S.data.serviceItems;
  if (!rows || !rows.length) return ROUTINE_ITEMS_FALLBACK;
  return rows.map((r) => ({ type: r.item_type, label: r.label, unit: r.unit, step: Number(r.qty_step) || 1, km: r.interval_km, months: r.interval_months }));
}

  "truck-clutch-hydraulic.jpg": "Kopling hidrolik", "truck-cabin.jpg": "Kabin", "truck-wheel-rim.jpg": "Velg & baud", "truck-brake.jpg": "Rem",

// The engine photo's two filter dots are named after the old "Ganti filter"
// failure modes; here they are routine service (the truck has two fuel
// filters, so the fuel-filter dot asks which).
const ROUTINE_BY_FM = { "Ganti filter oli": "filter_oli", "Ganti filter solar": "filter_solar" };
const CRACK_FMS = ["Chassis retak/las", "Chassis retak/lakop"];
let ZONES = [], GROUPS = {}, WHEEL_PAGE = null, BRAKE_CHOICES = [], WHEEL_CHOICES = [], POSITION_LABELS = {}, POSITIONS_BY_FM = {};

function buildDiagram(overrides) {
  if (!SPEC) return;
  const ov = {};
  (overrides || []).forEach((o) => { ov[o.slot_id] = o; });
  const at = (imageKey, slot, left, top) => {
    const o = ov[imageKey + "::" + slot];
    return o ? { left: Number(o.left_pct), top: Number(o.top_pct) } : { left: parseFloat(left), top: parseFloat(top) };
  };
  const base = (src) => src.split("/").pop();
  const part = (imageKey, h) => ({
    id: h.id || null, fm: h.key, label: h.caption || h.label, ...at(imageKey, h.id || h.key, h.left, h.top),
    brake: !!(h.id && h.id.indexOf("rem-") === 0), routine: ROUTINE_BY_FM[h.key] || null,
  });
  const detailPages = (zone) => (SPEC.details[zone] || []).map((d, i) => {
    const imageKey = zone + "-" + i;
    return { title: PAGE_TITLES[base(d.src)] || d.alt, src: d.src, imageKey,
      crack: zone === "chassis" && i === 0, parts: d.hotspots.map((h) => part(imageKey, h)) };
  });
  WHEEL_PAGE = { title: "Roda (tampak bawah)", src: "/static/truck-diagram/truck-underside.jpg", imageKey: "underside",
    wheels: SPEC.wheels.map((w) => ({ code: w.code, num: w.num, ...at("underside", w.code, w.left, w.top) })) };
  const powertrainPage = { title: "Powertrain (tampak bawah)", src: "/static/truck-diagram/truck-underside.jpg", imageKey: "underside",
    parts: SPEC.powertrain.map((h) => part("underside", h)) };
  GROUPS = {
    mesin: detailPages("mesin"), kelistrikan: detailPages("kelistrikan"), chassis: detailPages("chassis"), kabin: detailPages("kabin"),
    transmisi: [powertrainPage, ...detailPages("transmisi")], ban: [WHEEL_PAGE, ...detailPages("roda")],
  };
  ZONES = SPEC.zones.map((z) => ({ key: z.key, label: z.label, ...at("side", z.key, z.left, z.top),
    cats: ZONE_CATS[z.key] || [z.key], group: GROUPS[z.key] && GROUPS[z.key].length ? z.key : null }));
  BRAKE_CHOICES = SPEC.brakeChoices || [];
  WHEEL_CHOICES = SPEC.wheelFms || [];
  // Positions: the spec's explicit list, labelled with the picture each
  // place sits on; wheels for the wheel problems.
  const where = {};
  Object.values(GROUPS).flat().forEach((pg) => (pg.parts || []).forEach((p) => { if (p.id && !where[p.id]) where[p.id] = pg.title; }));
  POSITIONS_BY_FM = {};
  Object.entries(SPEC.positions || {}).forEach(([fm, list]) => {
    POSITIONS_BY_FM[fm] = list.map(([key, label]) => ({ key, kind: "component", label, where: where[key] || "" }));
  });
  WHEEL_CHOICES.forEach((fm) => { POSITIONS_BY_FM[fm] = WHEEL_PAGE.wheels.map((w) => ({ key: w.code, kind: "wheel", label: "Roda " + w.num })); });
  POSITION_LABELS = {};
  Object.values(GROUPS).flat().forEach((pg) => (pg.parts || []).forEach((p) => { if (p.id) POSITION_LABELS[p.id] = p.label; }));
  Object.values(POSITIONS_BY_FM).flat().forEach((p) => { POSITION_LABELS[p.key] = p.label; });
}

const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const $ = (sel, root = document) => root.querySelector(sel);

function fmtDate(iso) {
  if (!iso) return "";
  const d = new Date(iso);
  return d.toLocaleDateString("id-ID", { day: "numeric", month: "short" }) + " " + d.toLocaleTimeString("id-ID", { hour: "2-digit", minute: "2-digit" });

function since(iso) {

}

// ---------- API ----------
async function api(action, payload = {}) {
  if (S.mode === "demo") return demoApi(action, payload);
  const body = { action, payload };
  if (S.mode === "telegram") body.initData = tg.initData;
  else { body.deviceKey = S.deviceKey; if (S.session) body.sessionToken = S.session; }
  let resp;
  try {
    resp = await fetch(API_URL, { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify(body) });
  } catch (e) {
    throw new Error("Tidak ada koneksi. Coba lagi.");
  }
  const out = await resp.json().catch(() => ({}));
  if (!resp.ok) {
    console.error("mekanik-api call failed:", action, resp.status, out);
    if (out.code === "session_expired" && S.mode === "tablet") { lockNow(true); }
    if (out.code === "device_unknown") { S.deviceKey = null; try { localStorage.removeItem(DEVICE_KEY_STORE); } catch (e) { /* ignore */ } render(); }
    const err = new Error(out.error || "Gagal (" + resp.status + ")");
    err.code = out.code;
    throw err;
  }
  return out;
}

async function load() {
  S.data = await api("init_data");
  S.me = S.data.me || S.me;
  buildDiagram(S.data.diagramOverrides);
  render();
  if (S.draft && S.me && S.draft.mechId === S.me.id) {
    S.sheet = { ...S.draft.sheet, shown: false };
    renderSheet();
    toast("Isian tadi masih ada.");
  }
  S.draft = null;
}

// ---------- derived data ----------
function fmById(id) { return (S.data.failureModes || []).find((f) => f.id === id); }
function fmByName(n) { return (S.data.failureModes || []).find((f) => f.name === n); }
function mechName(id) { const m = (S.data.mechanics || []).find((x) => x.id === id); return m ? m.name : ""; }
function truckState(id) { return (S.data.truckStates || []).find((t) => t.truck_id === id); }
function openRepairOf(id) { return (S.data.openRepairs || []).find((r) => r.truck_id === id); }
function pendingOf(id) { return (S.data.pendingSignoff || []).filter((r) => r.truck_id === id); }
function issueTitle(i) {
  const fm = i.failure_modes && i.failure_modes.name;
  if (fm && fm !== "Lainnya") return fm;
  return i.description || fm || "(tanpa keterangan)";
}
function issuePlace(i) {
  const pos = POSITION_LABELS[i.component_position] || POSITION_LABELS[i.wheel_position] || i.chassis_position || "";
  const cat = i.failure_modes && i.failure_modes.category;
  return [cat ? cat.replace("_", " ") : "", pos].filter(Boolean).join(" · ");
}
function positionsFor(fmId) { const f = fmById(fmId); return (f && POSITIONS_BY_FM[f.name]) || null; }
function missingPosition(fmId, comp, wheel) { return !!positionsFor(fmId) && !comp && !wheel; }
// "Di mana?" -- wheels on the underside photo (same numbers as the photo
// route), everything else as buttons named after where they sit.
function posChooser(fmId, compKey, wheelKey, act) {
  const list = positionsFor(fmId) || [];
  if (list[0] && list[0].kind === "wheel") {
    const page = WHEEL_PAGE;
    return `<div class="photo"><img src="${img(page.src)}" alt="Roda tampak bawah">${page.wheels.map((w) => `<button class="spot ${wheelKey === w.code ? "open sel" : ""}" style="left:${w.left}%;top:${w.top}%" data-act="${act}" data-k="${w.code}">${w.num}</button>`).join("")}</div>`;
  }
  return `<div class="chips">${list.map((p) => `<button class="chip ${compKey === p.key ? "on" : ""}" style="min-height:52px" data-act="${act}" data-k="${esc(p.key)}">${esc(p.label)}<span style="font-weight:500;opacity:.75"> · ${esc(p.where)}</span></button>`).join("")}</div>`;
}
function posByKey(fmId, key) { return (positionsFor(fmId) || []).find((p) => p.key === key); }
function statusChip(status) {
  if (status === "in_progress") return ["st-work", "Dikerjakan"];
  if (status === "request_for_parts") return ["st-amber", "Minta part"];
  if (status === "vendor_selected") return ["st-amber", "Tunggu part"];
  if (status === "done" || status === "verified") return ["st-done", "Beres"];
  return ["st-neutral", "Dilaporkan"];
}
function isDone(i) { return i.status === "done" || i.status === "verified" || (S.pending && S.pending.key === "issue:" + i.id); }
function workersOf(r) {
  const w = new Set([r.marked_done_by_mechanic_id, ...(r.repair_record_issues || []).map((i) => i.done_by_mechanic_id)].filter(Boolean));
  if (!w.size && r.repaired_by) w.add(r.repaired_by);
  return w;
}
function truckSummary(t) {
  const r = openRepairOf(t.id);
  const pend = pendingOf(t.id);
  if (r) {
    const issues = r.repair_record_issues || [];
    const notDone = issues.filter((i) => !isDone(i));
    const first = notDone[0] || issues[0];
    let chip;
    if (!notDone.length) chip = ["st-done", "Siap ditutup"];
    else if (notDone.some((i) => i.status === "in_progress")) chip = ["st-work", "Dikerjakan"];
    else if (notDone.some((i) => i.status === "request_for_parts" || i.status === "vendor_selected")) chip = ["st-amber", "Tunggu part"];
    else chip = ["st-neutral", "Dilaporkan"];
    const more = issues.length > 1 ? ` · ${issues.length} masalah` : "";
    return { needs: true, title: first ? issueTitle(first) : "Servis", meta: (first ? issuePlace(first) : "") + more, chip };
  }
  if (pend.length) {
    const who = [...workersOf(pend[0])].map(mechName).filter(Boolean).join(", ");
    return { needs: true, title: issueTitle((pend[0].repair_record_issues || [])[0] || {}), meta: "Beres" + (who ? " · " + who : ""), chip: ["st-done", "Tunggu dicek"] };
  }
  return { needs: false };
}
function toCheck() {
  return (S.data.pendingSignoff || []).filter((r) => S.me && !workersOf(r).has(S.me.id));
}
function myWaiting() {
  return (S.data.pendingSignoff || []).filter((r) => S.me && workersOf(r).has(S.me.id));
}

      <button class="btn btn-soft" data-act="lapor" data-truck="${esc(id)}">+ Masalah lain</button>
      ${allDone ? `<button class="btn btn-green" data-act="repair-done" data-rid="${esc(r.id)}" ${S.pending && S.pending.key === "repair:" + r.id ? "disabled" : ""}>Servis selesai</button>` : ""}
    </div>`;
  }
  pend.forEach((p) => {
    const who = [...workersOf(p)].map(mechName).filter(Boolean).join(", ");
    out += `<div class="group"><div class="row"><span class="grow"><span class="title">Servis #${esc(p.seq)} beres${who ? " · " + esc(who) : ""}</span><span class="meta">Tunggu dicek mekanik lain</span></span><span class="pill st-done">Tunggu dicek</span></div></div>`;
  });
  return out + renderService(id);
}

async function loadLockList() {
  try {
    const { mechanics } = await api("tablet_mechanics");
    S.lock.mechanics = mechanics || [];
    if (S.lock.mechanics.length === 1) S.lock.pick = S.lock.mechanics[0].id;
  } catch (e) { S.lock.error = e.message; }
  render();
}

async function pinDigit(d) {
  const L = S.lock;
  if (L.pin.length >= 4) return;
  L.pin += d; L.error = "";
  render();
  if (L.pin.length < 4) return;
  const mech = L.mechanics.find((m) => m.id === L.pick);
  if (!mech) return;
  if (!mech.has_pin) {
    if (!L.creating) { L.creating = L.pin; L.pin = ""; render(); return; }
    if (L.creating !== L.pin) { L.creating = null; L.pin = ""; L.error = "PIN tidak sama. Ulangi."; render(); return; }
    try { await api("create_pin", { mechanic_id: mech.id, pin: L.pin }); mech.has_pin = true; }
    catch (e) { L.creating = null; L.pin = ""; L.error = e.message; render(); return; }
  }
  try {
    const out = await api("pin_login", { mechanic_id: mech.id, pin: L.pin });
    S.session = out.sessionToken; S.me = out.mechanic;
    L.pin = ""; L.creating = null; L.error = "";
    touch();
    render();
    await load();
  } catch (e) {
    L.pin = ""; L.error = e.message; render();
  }
}

// ---------- auto-lock (tablet) ----------
let idleTimer = null;
function touch() {
  if (S.mode === "telegram" || !S.session) return;
  clearTimeout(idleTimer);
  idleTimer = setTimeout(() => lockNow(false), LOCK_AFTER_MS);
}
function lockNow(expired) {
  flushPending();
  // Whatever was half-filled stays for the same mechanic's next PIN; anyone
  // else starts clean.
  S.draft = S.sheet && S.me ? { mechId: S.me.id, sheet: S.sheet } : null;
  if (S.session && !expired && S.mode === "tablet") api("logout").catch(() => {});
  S.session = null; S.me = null; S.data = null; S.sheet = null;
  S.view = "board"; S.truckId = null;
  S.lock.pin = ""; S.lock.creating = null; S.lock.pick = null;
  S.lock.error = expired ? "Sesi habis. Masukkan PIN lagi." : "";
  clearTimeout(idleTimer);
  render();
  loadLockList();
}

// ---------- undo: commit after 10 s unless cancelled ----------
function later(key, label, run) {
  flushPending();
  const p = { key, label, run, timer: null };
  p.timer = setTimeout(() => commitPending(p), UNDO_MS);
  S.pending = p;
  toast(label, true);
  render();
}
async function commitPending(p) {
  if (S.pending !== p) return;
  S.pending = null;
  clearTimeout(p.timer);
  try { await p.run(); haptic("success"); }
  catch (e) { toast("Gagal: " + e.message); }
  load().catch(() => {});
}
function flushPending() { if (S.pending) commitPending(S.pending); }
$("#toast-undo").addEventListener("click", () => {
  if (!S.pending) return;
  clearTimeout(S.pending.timer);
  S.pending = null;
  $("#toast").classList.remove("show");
  render();
});
window.addEventListener("pagehide", flushPending);
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "hidden") flushPending(); });

async function run(fn, okMsg) {
  try {
    await fn();
    if (okMsg) { toast(okMsg); haptic("success"); }

}

let lastTap = null; // where the last tap landed, for marking a crack on the frame photo
document.addEventListener("click", async (ev) => {
  const el = ev.target.closest("[data-act]");
  lastTap = [ev.clientX, ev.clientY];
  touch();
  if (!el || el.disabled) return;
  // The backdrop closes the sheet only when it is itself what was tapped,
  // not when a tap inside the sheet bubbles up to it.
  if (el.dataset.act === "sheet-bg" && ev.target !== el) return;
  const a = el.dataset.act;
  const d = el.dataset;
  switch (a) {
    case "lock": if (S.mode !== "telegram") lockNow(false); return;
    case "who": S.lock.pick = d.id; S.lock.pin = ""; S.lock.creating = null; S.lock.error = ""; render(); return;
    case "pin": pinDigit(d.v); return;

    case "filter": S.filter = d.v; render(); return;
    case "truck": S.truckId = d.id; S.view = "truck"; render(); window.scrollTo(0, 0); return;
    case "back": S.view = "board"; render(); return;

    case "cek": S.view = "cek"; render(); window.scrollTo(0, 0); return;
    case "lapor": openLapor(d.truck || (wide() && S.truckId) || null); return;
    case "location": {

      run(() => api("update_location", { id: d.rid, location: d.v }), "Lokasi: " + LOCATION_LABELS[d.v]);

    }
    case "start": run(() => api("request_parts", { repair_record_id: d.rid, issues: [{ id: d.iid, parts_used: "" }] }), "Mulai dikerjakan."); return;
    case "arrived": run(() => api("start_progress_from_vendor", { id: d.iid }), "Mulai dikerjakan."); return;

});

// ---------- photos ----------
const MAX_VIDEO_BYTES = 15 * 1024 * 1024;
let photoRepair = null;
function pickPhoto(rid) { photoRepair = rid; $("#photo-input").value = ""; $("#photo-input").click(); }
function fileToBase64(file) {
  return new Promise((ok, bad) => { const r = new FileReader(); r.onerror = () => bad(new Error("Gagal membaca file")); r.onload = () => ok(String(r.result).split(",")[1]); r.readAsDataURL(file); });
}
function resizeImageToBase64(file, maxDim, quality) {
  return new Promise((ok, bad) => {
    const im = new Image(); const r = new FileReader();
    r.onerror = () => bad(new Error("Gagal membaca file"));
    r.onload = () => {
      im.onerror = () => bad(new Error("Gagal memuat gambar"));
      im.onload = () => {
        let { width, height } = im;
        if (width > maxDim || height > maxDim) { const s = maxDim / Math.max(width, height); width = Math.round(width * s); height = Math.round(height * s); }
        const c = document.createElement("canvas"); c.width = width; c.height = height;
        c.getContext("2d").drawImage(im, 0, 0, width, height);
        ok(c.toDataURL("image/jpeg", quality).split(",")[1]);
      };
      im.src = r.result;
    };
    r.readAsDataURL(file);
  });
}
$("#photo-input").addEventListener("change", async (ev) => {
  const file = ev.target.files && ev.target.files[0];
  if (!file || !photoRepair) return;
  const isVideo = file.type.startsWith("video/");
  if (isVideo && file.size > MAX_VIDEO_BYTES) { toast("Video terlalu besar (maks 15 MB). Ambil video lebih pendek."); return; }
  toast("Mengunggah…");
  run(async () => {
    const b64 = isVideo ? await fileToBase64(file) : await resizeImageToBase64(file, 1600, 0.8);
    await api("upload_photo", { repair_record_id: photoRepair, media_type: isVideo ? "video" : "photo", filename: file.name || (isVideo ? "video.mp4" : "foto.jpg"), content_base64: b64 });
  }, "Foto tersimpan.");
});

// ---------- sheets ----------
function closeSheet() { S.sheet = null; renderSheet(); }
function renderSheet() {
  const root = $("#sheet-root");
  if (!S.sheet || !S.data) { root.innerHTML = ""; return; }
  const s = S.sheet;
  const body = s.type === "lapor" ? laporView(s) : s.type === "parts" ? partsView(s) : editView(s);
  // Animate only when the sheet opens -- every tap inside re-renders it, and
  // replaying the slide-up each time reads as flicker.
  const first = !s.shown;
  s.shown = true;
  const keepScroll = root.querySelector(".sheet-body");
  const scrollTop = keepScroll ? keepScroll.scrollTop : 0;
  root.innerHTML = `<div class="sheet-backdrop ${first ? "anim" : ""}" data-act="sheet-bg"><div class="sheet" role="dialog" aria-modal="true">${body}</div></div>`;
  const nb = root.querySelector(".sheet-body");
  if (nb && !first) nb.scrollTop = scrollTop;
  const ta = root.querySelector("textarea[data-bind]");
  if (ta && s.focus === ta.dataset.bind) { ta.focus(); ta.setSelectionRange(ta.value.length, ta.value.length); }
  root.querySelectorAll(".photo img").forEach((im) => { if (im.complete) nudgeSpots(im.parentNode); else im.addEventListener("load", () => nudgeSpots(im.parentNode), { once: true }); });
}
// Labels are much bigger than the dashboard's dots, so neighbours collide.
// The dots never move. Lowest labels keep their place; a colliding label
// is lifted higher on its stem, or else hangs below its dot, or else slides
// sideways -- whichever first lands clear and inside the photo.
function nudgeSpots(photo) {
  const all = [...photo.querySelectorAll(".spot.pin")];
  all.forEach((el) => { el.style.removeProperty("--lift"); el.style.removeProperty("--dx"); el.classList.remove("below"); });
  // On a phone only the chosen part carries a label (see the CSS).
  const pins = matchMedia("(max-width: 599px)").matches ? all.filter((el) => el.classList.contains("sel")) : all;
  const pr = photo.getBoundingClientRect();
  const placed = [];
  const inside = (r) => r.left >= pr.left + 2 && r.right <= pr.right - 2 && r.top >= pr.top + 2 && r.bottom <= pr.bottom - 2;
  const hitOf = (r) => placed.find((a) => a.left < r.right - 2 && r.left < a.right - 2 && r.top < a.bottom + 2 && r.bottom > a.top - 2);
  const at = (r, dx, dy) => ({ left: r.left + dx, right: r.right + dx, top: r.top + dy, bottom: r.bottom + dy });
  pins.map((el) => ({ el, r: el.getBoundingClientRect() })).sort((a, b) => b.r.bottom - a.r.bottom).forEach(({ el, r }) => {
    const h = r.bottom - r.top;
    const edgeDx = r.left < pr.left + 4 ? pr.left + 4 - r.left : r.right > pr.right - 4 ? pr.right - 4 - r.right : 0;
    const belowDy = h + 24; // label under the dot: dot sits 12px from either edge
    const liftAt = (dx) => {
      let lift = 0;
      for (let k = 0; k < 8; k++) {
        const hit = hitOf(at(r, dx, -lift));
        if (!hit) break;
        lift += r.bottom - lift - (hit.top - 4);
      }
      return lift;
    };
    const sides = [30, 60, 90, 120].flatMap((d) => [edgeDx + d, edgeDx - d]);
    const tries = [
      { dx: edgeDx, lift: liftAt(edgeDx), below: false },
      { dx: edgeDx, lift: 0, below: true },
      ...sides.map((dx) => ({ dx, lift: 0, below: false })),
      ...sides.map((dx) => ({ dx, lift: liftAt(dx), below: false })),
      ...sides.map((dx) => ({ dx, lift: 0, below: true })),
    ];
    const rectOf = (t) => at(r, t.dx, t.below ? belowDy : -t.lift);
    // Nothing fully clear (a crowded close-up): least overlap wins.
    const clash = (q) => placed.reduce((sum, a) => sum + Math.max(0, Math.min(a.right, q.right) - Math.max(a.left, q.left)) * Math.max(0, Math.min(a.bottom, q.bottom) - Math.max(a.top, q.top)), 0);
    const score = (t) => clash(rectOf(t)) + (inside(rectOf(t)) ? 0 : 1e9);
    const pick = tries.find((t) => inside(rectOf(t)) && !hitOf(rectOf(t)))
      || tries.reduce((best, t) => (score(t) < score(best) ? t : best), tries[0]);
    if (pick.dx) el.style.setProperty("--dx", pick.dx + "px");
    if (pick.below) el.classList.add("below");
    else if (pick.lift) el.style.setProperty("--lift", pick.lift + "px");
    placed.push(rectOf(pick));
  });
}

let suggestTimer = null;
function suggestFromText() {
  clearTimeout(suggestTimer);
  const s = S.sheet;
  const text = (s.desc || "").trim();
  if (text.length < 4) { if (s.suggestion) { s.suggestion = null; } return; }
  suggestTimer = setTimeout(async () => {
    try {
      const { failure_mode_id, confidence } = await api("classify_failure_mode", { description: text });
      if (S.sheet !== s) return;
      const f = failure_mode_id && confidence !== "none" ? fmById(failure_mode_id) : null;
      const changed = (f && f.id) !== (s.suggestion && s.suggestion.id);
      s.suggestion = f ? { id: f.id, name: f.name } : null;
      if (changed) renderSheet();
    } catch (e) { /* a suggestion never blocks anything */ }
  }, 900);
}

async function loadRoutineLast(s) {
  if (!s.truckId || !s.rItem) return;
  s.rLast = null;
  try {
    const { latestByItem } = await api("list_routine_maintenance", { truck_id: s.truckId });
    const log = latestByItem && latestByItem[s.rItem];
    s.rLast = log ? `Terakhir ${log.performed_at} oleh ${log.performed_by}${log.quantity ? ` (${log.quantity} ${log.unit || ""})` : ""}` : "";
  } catch (e) { s.rLast = ""; }
  if (S.sheet === s) renderSheet();
}

      <span class="eyebrow">Catatan</span><textarea class="field" data-bind="desc">${esc(s.desc)}</textarea>
      ${s.count > 1 ? `<button class="btn btn-plain" data-act="e-del" style="color:var(--red)">Hapus masalah ini (salah lapor)</button>` : `<p class="hint">Ini satu-satunya masalah di servis ini, jadi tidak bisa dihapus.</p>`}
    </div></div></div>
    <div class="sheet-foot"><span class="summary">${missingPosition(s.fmId, s.comp, s.wheel) ? "Pilih posisinya dulu." : esc((posByKey(s.fmId, s.comp || s.wheel) || {}).label || "")}</span><button class="btn btn-primary" style="min-width:220px;min-height:60px" data-act="e-save" ${missingPosition(s.fmId, s.comp, s.wheel) ? "disabled" : ""}>Simpan</button></div>`;
}

// ----- sheet actions -----
function sheetAction(a, el) {
  const s = S.sheet;
  const d = el.dataset;
  if (a === "sheet-bg") { closeSheet(); return; }
  if (a === "sheet-close") { closeSheet(); return; }
  if (!s) return;
  const rerender = () => renderSheet();
  switch (a) {
    case "l-tab": s.tab = d.v; rerender(); if (s.tab === "rutin") loadRoutineLast(s); return;
    case "l-truck": Object.assign(s, { truckId: d.id, pickTruck: false, zone: null, group: null, page: 0, pick: null, pop: null, all: !ZONES.length }); rerender(); if (s.tab === "rutin") loadRoutineLast(s); return;
    case "l-ganti": s.pickTruck = true; rerender(); return;
    case "l-zone": {
      const z = ZONES.find((x) => x.key === d.v);
      Object.assign(s, { zone: z.key, group: null, page: 0, pop: null, all: false, allCat: null });
      rerender(); return;
    }
    case "l-into": { const z = ZONES.find((x) => x.key === s.zone); if (z && z.group) { s.group = z.group; s.page = 0; s.pop = null; } rerender(); return; }
    case "l-up": Object.assign(s, { group: null, pop: null }); rerender(); return;
    case "l-page": s.page = Number(d.v); s.pop = null; rerender(); return;
    case "l-all": s.all = true; s.allCat = null; s.pop = null; rerender(); return;
    case "l-allcat": s.allCat = d.v; rerender(); return;
    case "l-loc": s.loc = d.v; rerender(); return;
    case "l-fm": { const f = fmById(d.id); s.pick = { fmId: f.id, fmName: f.name, label: f.name }; rerender(); return; }
    case "l-suggest": { const f = fmById(s.suggestion.id); if (f) s.pick = { fmId: f.id, fmName: f.name, label: f.name }; rerender(); return; }
    case "l-part": {
      const page = GROUPS[s.group][s.page];
      const p = page.parts[Number(d.v)];
      // The photo shows one fuel-filter spot but the truck has two filters
      // (primer + utama) -- let them pick which, rather than guess.
      if (p.routine) { Object.assign(s, { tab: "rutin", rItem: p.routine === "filter_solar" ? null : p.routine }); rerender(); loadRoutineLast(s); return; }
      if (p.brake) { s.pop = { title: p.label, choices: BRAKE_CHOICES, positionId: p.id, label: p.label, spot: page.imageKey + ":" + d.v }; rerender(); return; }
      const f = fmByName(p.fm);
      if (!f) { toast("Jenis masalah ini belum ada di katalog."); return; }
      // Which dot, not just which problem: two dots can share a problem type.
      s.pick = { fmId: f.id, fmName: f.name, component_position: p.id || null, spot: page.imageKey + ":" + d.v, label: p.label + (p.label !== f.name ? " · " + f.name : "") };
      s.pop = null; rerender(); return;
    }
    case "l-wheel": { const w = GROUPS[s.group][s.page].wheels[Number(d.v)]; s.pop = { title: "Roda " + w.num, choices: WHEEL_CHOICES, wheelCode: w.code, label: "Roda " + w.num }; rerender(); return; }
    case "l-pos": {
      const p = posByKey(s.pick.fmId, d.k);
      if (!p) return;
      s.pick = { ...s.pick, component_position: p.kind === "component" ? p.key : null, wheel_position: p.kind === "wheel" ? p.key : null, label: p.label + " · " + s.pick.fmName };
      rerender(); return;
    }
    case "l-crack": {
      const b = el.getBoundingClientRect();
      if (!b.width || !lastTap) return;
      const pt = { left_pct: Math.round(((lastTap[0] - b.left) / b.width) * 1000) / 10, top_pct: Math.round(((lastTap[1] - b.top) / b.height) * 1000) / 10 };
      s.pop = { title: "Rangka", choices: CRACK_FMS, crackAt: pt, label: "Rangka" };
      rerender(); return;
    }
    case "l-pop-close": s.pop = null; rerender(); return;
    case "l-pop-pick": {
      const f = fmByName(s.pop.choices[Number(d.v)]);
      const c = s.pop.crackAt;
      if (f && c) s.pick = { fmId: f.id, fmName: f.name, label: "Rangka · " + f.name, chassis_position: `Rangka ${Math.round(c.left_pct)}% ${Math.round(c.top_pct)}%`, crack_point: c };
      else if (f) s.pick = { fmId: f.id, fmName: f.name, component_position: s.pop.positionId || null, wheel_position: s.pop.wheelCode || null, spot: s.pop.spot || null, label: s.pop.label + " · " + f.name };
      s.pop = null; rerender(); return;
    }
    case "l-existing": { const tid = s.truckId; closeSheet(); S.truckId = tid; S.view = "truck"; render(); return; }
    case "l-save": {
      const r = openRepairOf(s.truckId);
      const payload = { failure_mode_id: s.pick.fmId, description: s.desc.trim() || null, wheel_position: s.pick.wheel_position || null, component_position: s.pick.component_position || null, chassis_position: s.pick.chassis_position || null, crack_point: s.pick.crack_point || null };
      const tid = s.truckId;
      closeSheet();
      S.truckId = tid; S.view = "truck";
      // One ticket per truck: a truck already in the workshop gets the new
      // problem added to its open repair, never a second repair.
      run(() => r ? api("add_issue", { repair_record_id: r.id, ...payload }) : api("create_repair", { truck_id: tid, location: s.loc, ...payload }), "Laporan tersimpan.");
      return;
    }
    case "r-item": s.rItem = d.v; s.rQty = 0; rerender(); loadRoutineLast(s); return;
    case "r-qty": { const it = routineItems().find((i) => i.type === s.rItem); s.rQty = Math.max(0, (s.rQty || 0) + Number(d.v) * (it.step || 1)); rerender(); return; }
    case "r-save": {
      const it = routineItems().find((i) => i.type === s.rItem);
      const payload = { truck_id: s.truckId, item_type: s.rItem, performed_at: s.rDate, quantity: it.unit && s.rQty ? s.rQty : null, unit: it.unit && s.rQty ? it.unit : null, notes: (s.rNotes || "").trim() || null };
      closeSheet();
      run(() => api("add_routine_maintenance", payload), "Servis rutin dicatat.");
      return;
    }
    case "p-qty": { const n = d.n; s.items[n] = Math.max(0, (s.items[n] || 0) + Number(d.v)); if (!s.items[n] && !(PART_SUGGESTIONS[s.cat] || []).includes(n)) delete s.items[n]; rerender(); return; }
    case "p-add": { const n = (s.other || "").trim(); if (!n) return; s.items[n] = (s.items[n] || 0) + 1; s.other = ""; rerender(); return; }
    case "p-send": {
      const text = Object.entries(s.items).filter(([, q]) => q > 0).map(([n, q]) => (q > 1 ? `${n} ×${q}` : n)).join(", ");
      const { rid, iid } = s;
      closeSheet();
      run(() => api("request_parts", { repair_record_id: rid, issues: [{ id: iid, parts_used: text }] }), "Permintaan part terkirim.");
      return;
    }
    case "e-cat": s.cat = d.v; rerender(); return;
    case "e-pos": {
      const p = posByKey(s.fmId, d.k);
      if (p) { s.comp = p.kind === "component" ? p.key : null; s.wheel = p.kind === "wheel" ? p.key : null; }
      rerender(); return;
    }
    case "e-save": {
      const { iid, fmId, desc } = s;
      const has = !!positionsFor(fmId);
      closeSheet();
      // A type with no positions carries none: a stale wheel from the old
      // type would otherwise stay attached to the new one.
      run(() => api("update_issue", { id: iid, failure_mode_id: fmId, description: (desc || "").trim() || null, component_position: has ? s.comp : null, wheel_position: has ? s.wheel : null }), "Tersimpan.");
      return;
    }
    case "e-del": {
      const { iid } = s;
      closeSheet();
      later("del:" + iid, "Masalah dihapus.", () => api("delete_issue", { id: iid }));
      return;
    }
  }
}
// The edit sheet reuses fmList, whose rows fire l-fm -- route that to the edit state.
document.addEventListener("click", (ev) => {
  const el = ev.target.closest("[data-act='l-fm']");
  if (el && S.sheet && S.sheet.type === "edit") {
    ev.stopImmediatePropagation();
    const s = S.sheet;
    s.fmId = el.dataset.id;
    // Keep the position only if it's a real place for the new type.
    if (!posByKey(s.fmId, s.comp || s.wheel)) { s.comp = null; s.wheel = null; }
    renderSheet();
  }
}, true);

// ---------- Telegram back button ----------
function syncTelegramBack() {
  if (!tg || !tg.BackButton) return;
  const show = !!S.sheet || (!wide() && (S.view === "truck" || S.view === "cek"));
  show ? tg.BackButton.show() : tg.BackButton.hide();
}
if (tg && tg.BackButton) tg.BackButton.onClick(() => {
  if (S.sheet) closeSheet(); else { S.view = "board"; render(); }
  syncTelegramBack();
});

// ---------- demo data (#demo): looks real, writes nothing ----------
function demoApi(action, payload) {
  const D = window.__demo || (window.__demo = makeDemo());
  if (action === "tablet_mechanics") return Promise.resolve({ mechanics: D.mechanics.map((m) => ({ ...m, has_pin: true })) });
  if (action === "pin_login") {
    if (payload.pin !== "1234") return Promise.reject(Object.assign(new Error("PIN salah. (demo: 1234)"), { code: "wrong_pin" }));
    return Promise.resolve({ sessionToken: "demo", mechanic: D.mechanics.find((m) => m.id === payload.mechanic_id) });
  }
  if (action === "init_data") return Promise.resolve({ ...D, me: S.me || D.mechanics[0] });
  if (action === "list_routine_maintenance") return Promise.resolve({ latestByItem: {} });
  if (action === "classify_failure_mode") return Promise.resolve({ failure_mode_id: null, confidence: "none" });
  return Promise.resolve({ ok: true, demo: true });
}

// ---------- start ----------
(async function init() {
  if (S.mode === "telegram") {
    tg.ready(); tg.expand();
    try { tg.setHeaderColor && tg.setHeaderColor("#F5F2EE"); tg.setBackgroundColor && tg.setBackgroundColor("#F5F2EE"); } catch (e) { /* older clients */ }
    render();
    try { await load(); } catch (e) { $("#app").innerHTML = `<div class="stack" style="max-width:480px;margin:25vh auto;padding:0 24px;text-align:center"><h1 class="large-title">Bengkel SKL</h1><p class="hint">${esc(e.message)}</p></div>`; }
    return;
  }
  if (S.mode === "tablet") {
    // One-time registration link: #setup=<device key>. Kept in this
    // browser only; the hash never reaches a server log.
    const m = location.hash.match(/^#setup=([0-9a-f]{48})$/);
    if (m) { try { localStorage.setItem(DEVICE_KEY_STORE, m[1]); } catch (e) { /* ignore */ } history.replaceState(null, "", location.pathname); }
    try { S.deviceKey = localStorage.getItem(DEVICE_KEY_STORE); } catch (e) { S.deviceKey = null; }
    if (!S.deviceKey) { render(); return; }
  }
  render();
  loadLockList();
})();
// Keep the board fresh while it's open (another mechanic, the dispatcher
// or the office may have changed something).
setInterval(() => { if (S.data && !S.sheet && !S.pending && document.visibilityState === "visible") load().catch(() => {}); }, 60000);
</script>
