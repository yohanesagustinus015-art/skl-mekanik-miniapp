<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Formulir Servis - PT SKL</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
  /*
    PT SKL brand system, matching skl-route-agent/dashboard.html
    (the live dispatcher dashboard) exactly -- confirmed as the real,
    already-shipped system rather than invented for this page (direct
    instruction, 2026-08-27: "the design of the miniapp needs work" ->
    match the dashboard). Fixed light theme only, no dark-mode variant --
    the dashboard has none either, so Telegram's own --tg-theme-* vars
    are deliberately NOT used here anymore; this app should look like
    SKL's own tool, not adapt to whatever theme the chat happens to be in.
  */
  :root {
    --bg: #F5F2EE; --surface: #FFFFFF; --surface2: #F0EBE4; --surface3: #E5DDD3;
    --border: #E2D9CC; --accent: #8B1A1A; --accent-hover: #6E1414; --accent-dim: #F3E3E3;
    --text: #2B2420; --muted: #7A6F63; --dim: #B0A594;
    --green: #1E8449; --red: #B91C1C;
    --mono: 'JetBrains Mono', monospace; --sans: 'Inter', sans-serif; --display: 'Fraunces', serif;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 16px 16px 32px;
    background: var(--bg); color: var(--text);
    font-family: var(--sans);
    font-size: 15px; line-height: 1.5;
  }
  h1 {
    font-family: var(--display); font-size: 22px; font-weight: 600; color: var(--accent);
    margin: 4px 0 2px;
  }
  .subtitle { color: var(--muted); font-size: 13px; margin-bottom: 18px; }
  .fm-hint { color: var(--muted); font-size: 12px; margin-top: 4px; min-height: 16px; }
  .tabs { display: flex; gap: 4px; margin-bottom: 20px; border-bottom: 1px solid var(--border); }
  .tab {
    flex: 1; text-align: center; padding: 10px 4px; font-size: 13px; font-weight: 600;
    color: var(--muted); border-bottom: 2px solid transparent; cursor: pointer; white-space: nowrap;
  }
  .tab.active { color: var(--accent); border-bottom-color: var(--accent); }
  .screen { display: none; }
  .screen.active { display: block; }
  label { display: block; font-size: 13px; color: var(--muted); margin: 16px 0 6px; }
  select, input, textarea {
    width: 100%; padding: 10px 12px; border-radius: 8px; border: 1px solid var(--border);
    background: var(--surface); color: var(--text); font-size: 15px; font-family: inherit;
  }
  select:focus, input:focus, textarea:focus { outline: none; border-color: var(--accent); }
  textarea { resize: vertical; min-height: 60px; }
  button.primary {
    width: 100%; margin-top: 22px; padding: 13px; border: none; border-radius: 8px;
    background: var(--accent); color: #fff; font-size: 15px; font-weight: 600;
    cursor: pointer; transition: background 0.15s;
  }
  button.primary:hover { background: var(--accent-hover); }
  button.primary:disabled { opacity: 0.5; }
  .card {
    background: var(--surface); border: 1px solid var(--border); border-radius: 10px;
    padding: 14px 16px; margin-bottom: 12px;
  }
  /* repair-card is the collapsible list version of .card, used on the
     Diperbaiki screen (direct feedback, 2026-08-29: "can the list of
     repairs being done be in a list form that can expand into the cards
     rather than the whole card showing outright") -- same visual shell,
     but the summary line is the always-visible compact row and
     repair-body only renders once expanded. */
  .repair-card {
    background: var(--surface); border: 1px solid var(--border); border-radius: 10px;
    margin-bottom: 12px; overflow: hidden;
  }
  .repair-summary {
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
    padding: 14px 16px; cursor: pointer; list-style: none;
  }
  .repair-summary::-webkit-details-marker { display: none; }
  .repair-summary::after {
    content: "\25B8"; color: var(--muted); font-size: 12px; flex-shrink: 0;
    transition: transform 0.15s;
  }
  .repair-card[open] .repair-summary::after { transform: rotate(90deg); }
  .repair-summary .truck-id { font-family: var(--mono); color: var(--accent); font-weight: 600; }
  .repair-summary-meta {
    font-size: 13px; color: var(--muted); text-align: right; overflow: hidden;
    text-overflow: ellipsis; white-space: nowrap;
  }
  .repair-body { padding: 0 16px 14px; }
  .card-title { font-weight: 600; margin-bottom: 2px; }
  .card-title .truck-id { font-family: var(--mono); color: var(--accent); }
  .card-meta { font-size: 13px; color: var(--muted); line-height: 1.5; }
  .card button, .repair-body button {
    margin-top: 12px; width: 100%; padding: 9px; border: 1px solid var(--accent);
    border-radius: 8px; background: var(--accent-dim); color: var(--accent);
    font-size: 14px; font-weight: 600; cursor: pointer;
  }
  .empty { color: var(--dim); text-align: center; padding: 32px 0; font-size: 14px; }
  /* Every distinct block inside a card (location, issues, add-issue,
     total) shares the same top rule + gap, so the card reads as evenly
     spaced sections instead of the parts nearest each other looking
     cramped and the parts near a dashed divider looking loose. */
  .card-section {
    margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--border);
  }
  .issue-row { padding: 6px 0; font-size: 14px; }
  details.add-issue summary {
    color: var(--accent); font-size: 13px; font-weight: 600; cursor: pointer; list-style: none;
  }
  details.add-issue summary::-webkit-details-marker { display: none; }
  details.add-issue[open] summary { margin-bottom: 4px; }
  .issue-edit summary { cursor: pointer; list-style: none; }
  .issue-edit summary::-webkit-details-marker { display: none; }
  .issue-edit[open] summary { color: var(--accent); }
  .issue-edit-actions { display: flex; gap: 8px; margin-top: 10px; }
  .issue-edit-actions button { margin-top: 0; flex: 1; }
  /* Wraps each issue's (.issue-edit details + .issue-actions) pair so
     consecutive masalah read as visually separate blocks -- direct
     feedback, 2026-08-30: "not enough white space" between them once
     both are expanded (before this, nothing but the details element's
     own tiny margins separated one masalah from the next). */
  .issue-unit { padding: 10px 0; border-top: 1px solid var(--border); }
  .issue-unit:first-child { border-top: none; padding-top: 0; }
  .card button.btn-danger, .repair-body button.btn-danger {
    border-color: var(--red); color: var(--red); background: transparent;
  }
  .card-total { font-size: 13px; color: var(--muted); }
  .toast {
    position: fixed; left: 16px; right: 16px; bottom: 16px; padding: 12px 16px;
    border-radius: 8px; background: var(--text); color: var(--bg); font-size: 14px;
    text-align: center; display: none; z-index: 10;
  }
  .not-telegram { text-align: center; padding: 60px 20px; color: var(--muted); }
  /* Per-issue lifecycle badge + actions (2026-08-30: request_parts/
     mark_issue_done) -- lives as a sibling block right after each
     .issue-edit <details>, not inside it, since an <input>/<button>
     inside a <summary> would fight the details/summary's own click
     toggle. */
  .issue-status-badge { display: inline-block; font-size: 11px; font-weight: 500; color: var(--muted); background: var(--surface2); border-radius: 10px; padding: 2px 8px; margin-left: 6px; vertical-align: middle; }
  .issue-actions { padding: 6px 0 10px; }
  .issue-vendor-note { font-size: 12.5px; color: var(--muted); }
  .issue-actions label { margin: 6px 0 4px; }
  .issue-actions button { margin-top: 8px; }
  .btn-request-parts { width: 100%; margin-top: 14px; padding: 12px; border: none; border-radius: 8px; background: var(--accent); color: #fff; font-size: 14px; font-weight: 600; cursor: pointer; }
  .btn-request-parts:disabled { opacity: 0.5; }
  .btn-done-disabled { width: 100%; margin-top: 12px; padding: 9px; border: 1px solid var(--border); border-radius: 8px; background: var(--surface2); color: var(--dim); font-size: 13px; text-align: center; }
  .photo-row { display: flex; align-items: center; gap: 10px; margin-top: 12px; flex-wrap: wrap; }
  .photo-btn { padding: 9px 14px; border: 1px solid var(--border); border-radius: 8px; background: var(--surface2); color: var(--text); font-size: 13px; font-weight: 600; cursor: pointer; text-align: center; }
  .photo-btn input { display: none; }
  .photo-count { font-size: 12px; color: var(--muted); }

  /* Truck diagram picker (Lapor Baru) -- see DIAGRAM_SCREENS in the
     script below. */
  #diagram-picker {
    border: 1px solid var(--border); border-radius: 10px; background: var(--surface);
    padding: 10px; margin-bottom: 4px;
  }
  .diagram-header { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
  .diagram-title { font-size: 13px; font-weight: 600; color: var(--text); }
  .diagram-back {
    border: none; background: none; color: var(--accent); font-size: 13px; font-weight: 600;
    cursor: pointer; padding: 2px 0;
  }
  .diagram-imgwrap { position: relative; width: 100%; border-radius: 8px; overflow: hidden; background: var(--surface2); }
  .diagram-imgwrap img { display: block; width: 100%; height: auto; }
  .diagram-dots { position: absolute; inset: 0; }
  /* Text-on-dot, not a bare circle -- there's no hover on a phone to
     reveal a caption the way the desktop dashboard's dots do, so the
     label has to be readable directly. */
  .diagram-dot {
    position: absolute; transform: translate(-50%, -50%);
    min-width: 22px; padding: 3px 7px; border: 2px solid #fff; border-radius: 999px;
    background: var(--accent); color: #fff; font-size: 11px; font-weight: 700;
    line-height: 1.2; text-align: center; cursor: pointer; box-shadow: 0 1px 4px rgba(0,0,0,0.35);
    white-space: nowrap;
  }
  .diagram-altgo, .diagram-skip, .diagram-change, #diagram-resume-btn {
    border: none; background: none; color: var(--accent); font-size: 12.5px; font-weight: 600;
    cursor: pointer; padding: 8px 0 2px; text-align: left; display: block;
  }
  .diagram-menu { display: flex; flex-direction: column; gap: 8px; }
  .diagram-menu-btn {
    padding: 12px; border: 1px solid var(--border); border-radius: 8px; background: var(--surface2);
    color: var(--text); font-size: 14px; text-align: left; cursor: pointer;
  }
  #diagram-summary {
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
    border: 1px solid var(--border); border-radius: 10px; background: var(--accent-dim);
    padding: 10px 12px; margin-bottom: 4px; font-size: 13.5px; font-weight: 600; color: var(--accent);
  }
  #diagram-summary .diagram-change { padding: 0; }
</style>
</head>
<body>

<div id="notTelegram" class="not-telegram" style="display:none">
  Buka formulir ini dari tombol "🔧 Buka Formulir Servis" di chat bot SKL Lapangan, bukan dari browser langsung.
</div>

<div id="app" style="display:none">
  <h1>Formulir Servis</h1>
  <div class="subtitle" id="mechanicName"></div>

  <div class="tabs">
    <div class="tab active" data-screen="new">Lapor Baru</div>
    <div class="tab" data-screen="done">Diperbaiki</div>
    <div class="tab" data-screen="signoff">Sign-off</div>
  </div>

  <div class="screen active" id="screen-new">
    <label>Truk</label>
    <select id="f-truck"></select>
    <label>Lokasi</label>
    <select id="f-location">
      <option value="pool">Pool</option>
      <option value="storing_luar">Storing luar</option>
      <option value="bengkel_luar">Bengkel luar</option>
    </select>

    <label>Di bagian mana?</label>
    <!--
      Direct instruction, 2026-09-12: let a mechanic tap the truck itself
      to say WHERE the problem is, instead of typing/picking a position
      that a director then has to fix after the fact -- all the hotspot
      grid-verification work in skl-route-agent/dashboard.html was only
      paying off for someone reviewing history at a desk, never at the
      moment a report is actually created. See DIAGRAM_SCREENS in the
      script below for the data (ported from that dashboard, same
      source of truth).
    -->
    <div id="diagram-picker">
      <div class="diagram-header">
        <button type="button" id="diagram-back" class="diagram-back" style="display:none">&larr; Kembali</button>
        <span id="diagram-title" class="diagram-title"></span>
      </div>
      <div id="diagram-body"></div>
      <button type="button" id="diagram-skip-btn" class="diagram-skip">Tidak ada di gambar / Lainnya</button>
    </div>
    <div id="diagram-summary" style="display:none">
      <span id="diagram-result-text"></span>
      <button type="button" id="diagram-change-btn" class="diagram-change">Ubah</button>
    </div>
    <div id="diagram-skip-note" class="fm-hint" style="display:none">
      Posisi dilewati -- pilih Jenis kerusakan langsung dari daftar di bawah.
      <button type="button" id="diagram-resume-btn" class="diagram-change">Coba lagi dari gambar</button>
    </div>

    <label>Jenis kerusakan</label>
    <select id="f-failure-mode"></select>
    <div class="fm-hint" id="f-fm-hint"></div>
    <label>Deskripsi</label>
    <textarea id="f-description" placeholder="Jelaskan kerusakan yang ditemukan... (mis. &quot;rem blong&quot;)"></textarea>
    <button class="primary" id="btn-create">Simpan Laporan</button>
  </div>

  <div class="screen" id="screen-done">
    <div id="list-open" class="empty">Memuat...</div>
  </div>

  <div class="screen" id="screen-signoff">
    <div id="list-signoff" class="empty">Memuat...</div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const API_URL = "https://kcftvbuwotjjroattdak.supabase.co/functions/v1/mekanik-api";
const tg = window.Telegram && window.Telegram.WebApp;

let catalogs = { failureModes: [], vendors: [], trucks: [] };

const LOCATION_LABELS = { pool: "Pool", storing_luar: "Storing luar", bengkel_luar: "Bengkel luar" };

// repair_record_issues.status labels -- mirrors mekanik-api's own
// ISSUE_STATUS_LABELS_ID and skl-route-agent dashboard.html's
// ISSUE_STATUS_LABELS (hand-kept in sync across the 3 codebases, same as
// LOCATION_LABELS already is between this file and mekanik-api).
const ISSUE_STATUS_LABELS = {
  reported: "Dilaporkan", diagnosed: "Terdiagnosis",
  request_for_parts: "Minta suku cadang", vendor_selected: "Vendor dipilih",
  in_progress: "Sedang diperbaiki", done: "Selesai", verified: "Terverifikasi",
};

function failureModeOptions(selected) {
  return catalogs.failureModes
    .map((f) => `<option value="${f.id}" ${f.id === selected ? "selected" : ""}>${f.name}</option>`)
    .join("");
}

function locationOptions(selected) {
  return Object.keys(LOCATION_LABELS)
    .map((k) => `<option value="${k}" ${k === selected ? "selected" : ""}>${LOCATION_LABELS[k]}</option>`)
    .join("");
}

function issueRowHtml(issue) {
  const fm = issue.failure_modes ? issue.failure_modes.name : "(lainnya)";
  const desc = issue.description ? " -- " + issue.description : "";
  return `<div class="issue-row">${fm}${desc}</div>`;
}

// Editable version, used only on the open-repairs ("Diperbaiki") screen
// -- a mechanic can add a missed detail, fix a wrong failure mode, or
// remove a misclick, but only while the session is still open (matches
// mekanik-api's own gate on update_issue/delete_issue). <details> so the
// default view stays scannable -- same progressive-disclosure pattern as
// "+ Tambah masalah".
function editableIssueRowHtml(issue) {
  const fm = issue.failure_modes ? issue.failure_modes.name : "(lainnya)";
  const desc = issue.description ? " -- " + issue.description : "";
  const badge = `<span class="issue-status-badge">${ISSUE_STATUS_LABELS[issue.status] || issue.status}</span>`;
  return `
    <details class="issue-edit" data-issue-id="${issue.id}">
      <summary class="issue-row">${fm}${desc}${badge}</summary>
      <label>Jenis kerusakan</label>
      <select class="edit-issue-fm">${failureModeOptions(issue.failure_mode_id)}</select>
      <label>Deskripsi</label>
      <textarea class="edit-issue-desc" placeholder="Jelaskan kerusakan yang ditemukan...">${issue.description || ""}</textarea>
      <div class="issue-edit-actions">
        <button class="btn-save-issue">Simpan</button>
        <button class="btn-delete-issue btn-danger">Hapus</button>
      </div>
    </details>
  `;
}

// Sibling block, NOT inside the <details> above -- an <input>/<button>
// inside a <summary> fights the details/summary click-to-toggle, so this
// renders as its own always-visible row right after it instead.
// 'reported' -> mechanic types what part's needed and submits THIS ONE
// issue right away (per-issue, not batched -- see btn-request-parts'
// click handler below for why).
// 'in_progress' -> mechanic marks this one issue done once physically
// fixed. Anything else (request_for_parts/vendor_selected/done/verified)
// is read-only here -- someone else (staff/owner) or the cascade from
// sign_off owns that transition.
function issueActionsHtml(issue) {
  if (issue.status === "reported") {
    // Per-issue submit (2026-08-30, direct feedback while testing --
    // previously one bulk button for the whole session, which had a real
    // bug: leaving a NOT-yet-diagnosed masalah's input blank looked
    // identical to "genuinely no part needed" and wrongly fast-forwarded
    // it to in_progress. Each masalah is now its own deliberate decision.
    return `
      <div class="issue-actions" data-issue-id="${issue.id}">
        <label>Suku cadang dibutuhkan (kosongkan jika tidak perlu beli apa-apa)</label>
        <input type="text" class="issue-parts-needed" placeholder="mis. aki, kampas rem" />
        <button class="btn-request-parts">Ajukan Permintaan Suku Cadang</button>
      </div>
    `;
  }
  if (issue.status === "vendor_selected") {
    // 2026-08-31, direct feedback: "let dispatcher/mechanic be able to
    // say mulai perbaikan when parts arrive" -- only show the button
    // once there's actually an approved quote to act on; otherwise a
    // read-only note (still waiting on the owner, nothing to do yet).
    const quotes = issue.vendor_quotes || [];
    const approved = quotes.find((q) => q.is_selected && q.approved_by_owner);
    if (approved) {
      return `
        <div class="issue-actions" data-issue-id="${issue.id}">
          <div class="issue-vendor-note">Vendor: ${approved.vendor_name} -- sudah disetujui</div>
          <button class="btn-start-progress">Mulai Perbaikan (Part Sudah Sampai)</button>
        </div>
      `;
    }
    const selected = quotes.find((q) => q.is_selected);
    return `
      <div class="issue-actions" data-issue-id="${issue.id}">
        <div class="issue-vendor-note">${selected ? "Menunggu persetujuan pemilik: " + selected.vendor_name : "Menunggu staff memilih vendor"}</div>
      </div>
    `;
  }
  if (issue.status === "in_progress") {
    return `
      <div class="issue-actions" data-issue-id="${issue.id}">
        <button class="btn-issue-done">Tandai Masalah Ini Selesai</button>
      </div>
    `;
  }
  return "";
}

// Videos can't go through canvas resize like photos can -- this pipeline
// sends files as base64 inside one JSON POST, not a streamed/chunked
// upload, so there's a real practical ceiling. 15MB raw (~20MB once
// base64-encoded) keeps a single upload well clear of typical edge
// function payload limits.
const MAX_VIDEO_BYTES = 15 * 1024 * 1024;

function fileToBase64(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onerror = () => reject(new Error("Gagal membaca file"));
    reader.onload = () => resolve(reader.result.split(",")[1]);
    reader.readAsDataURL(file);
  });
}

// Downscale a phone-camera photo before it goes into a base64 JSON
// payload (checklist C2, 2026-08-31) -- draws onto a canvas at reduced
// size, exports as JPEG, returns just the base64 (no data: URL prefix,
// mekanik-api decodes it raw).
function resizeImageToBase64(file, maxDim, quality) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    const reader = new FileReader();
    reader.onerror = () => reject(new Error("Gagal membaca file"));
    reader.onload = () => {
      img.onerror = () => reject(new Error("Gagal memuat gambar"));
      img.onload = () => {
        let { width, height } = img;
        if (width > maxDim || height > maxDim) {
          const scale = maxDim / Math.max(width, height);
          width = Math.round(width * scale);
          height = Math.round(height * scale);
        }
        const canvas = document.createElement("canvas");
        canvas.width = width;
        canvas.height = height;
        canvas.getContext("2d").drawImage(img, 0, 0, width, height);
        const dataUrl = canvas.toDataURL("image/jpeg", quality);
        resolve(dataUrl.split(",")[1]);
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}

function formatDate(iso) {
  if (!iso) return "";
  const d = new Date(iso);
  return d.toLocaleDateString("id-ID", { day: "numeric", month: "short", year: "numeric" })
    + " " + d.toLocaleTimeString("id-ID", { hour: "2-digit", minute: "2-digit" });
}

function toast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.style.display = "block";
  setTimeout(() => { t.style.display = "none"; }, 2600);
}

async function call(action, payload) {
  const resp = await fetch(API_URL, {
    method: "POST",
    headers: { "content-type": "application/json" },
    body: JSON.stringify({ initData: tg.initData, action, payload: payload || {} }),
  });
  const body = await resp.json().catch(() => ({}));
  if (!resp.ok) throw new Error(body.error || ("HTTP " + resp.status));
  return body;
}

function setScreen(name) {
  document.querySelectorAll(".tab").forEach((t) => t.classList.toggle("active", t.dataset.screen === name));
  document.querySelectorAll(".screen").forEach((s) => s.classList.toggle("active", s.id === "screen-" + name));
  if (name === "done") loadOpenRepairs();
  if (name === "signoff") loadPendingSignoff();
}

async function loadCatalogs() {
  const { failureModes, vendors, trucks } = await call("list_catalogs");
  catalogs = { failureModes: failureModes || [], vendors: vendors || [], trucks: trucks || [] };

  const truckSel = document.getElementById("f-truck");
  truckSel.innerHTML = catalogs.trucks
    .map((t) => `<option value="${t.id}">${t.nickname || t.plate || t.id}</option>`)
    .join("");

  const fmSel = document.getElementById("f-failure-mode");
  fmSel.innerHTML = catalogs.failureModes
    .map((f) => `<option value="${f.id}">${f.name}</option>`)
    .join("");
}

// ---- Truck diagram picker (Lapor Baru) --------------------------------
// Direct instruction, 2026-09-12: let a mechanic tap the truck itself to
// say WHERE the problem is, instead of typing/picking a position that a
// director then has to fix after the fact -- all the grid-verification
// work in skl-route-agent/dashboard.html was only paying off for someone

let diagramState = null;
function freshDiagramState() {
  return { stack: ["root"], resolvedFm: null, resolvedLabel: null, componentPosition: null, wheelPosition: null, categoryFilter: null };
}
diagramState = freshDiagramState();

function diagramFindFmId(name) {
  const f = catalogs.failureModes.find((x) => x.name === name);
  return f ? f.id : null;
}

function diagramResetFmOptions() {
  const fmSel = document.getElementById("f-failure-mode");
  fmSel.innerHTML = catalogs.failureModes.map((f) => `<option value="${f.id}">${f.name}</option>`).join("");
}

function diagramApplyResult() {
  const fmSel = document.getElementById("f-failure-mode");
  let list = catalogs.failureModes;
  if (diagramState.categoryFilter) list = list.filter((f) => f.category === diagramState.categoryFilter);
  fmSel.innerHTML = list.map((f) => `<option value="${f.id}">${f.name}</option>`).join("");
  if (diagramState.resolvedFm) {
    const fid = diagramFindFmId(diagramState.resolvedFm);
    if (fid) fmSel.value = fid;
  }
  document.getElementById("diagram-result-text").textContent = "📍 " + diagramState.resolvedLabel;
  document.getElementById("diagram-picker").style.display = "none";
  document.getElementById("diagram-summary").style.display = "flex";
  document.getElementById("diagram-skip-note").style.display = "none";
}

function diagramResolveZoneCategory(z) {
  diagramState.componentPosition = null;
  diagramState.wheelPosition = null;
  diagramState.categoryFilter = z.key;
  diagramState.resolvedFm = null;
  diagramState.resolvedLabel = z.label + " (semua jenis)";
  diagramApplyResult();
}

function diagramResolvePart(p) {
  diagramState.componentPosition = p.id || null;
  diagramState.wheelPosition = null;
  diagramState.categoryFilter = null;
  diagramState.resolvedFm = p.fm;
  diagramState.resolvedLabel = p.label;
  diagramApplyResult();
}

function diagramResolveWheel(w) {
  diagramState.componentPosition = null;
  diagramState.wheelPosition = w.code;
  diagramState.categoryFilter = "ban";
  // Ban bocor/pecah is the default guess for tapping a wheel directly --
  // still a normal, fully-editable dropdown afterward (narrowed to the
  // 'ban' category, same as every other resolved tap) in case it's
  // actually Baud roda/Velg instead.
  diagramState.resolvedFm = "Ban bocor/pecah";
  diagramState.resolvedLabel = "Roda " + w.num;
  diagramApplyResult();
}

function renderDiagram() {
  const screenId = diagramState.stack[diagramState.stack.length - 1];
  const screen = DIAGRAM_SCREENS[screenId];
  document.getElementById("diagram-title").textContent = screen.title;
  document.getElementById("diagram-back").style.display = diagramState.stack.length > 1 ? "" : "none";
  const body = document.getElementById("diagram-body");

  if (screen.menu) {
    const wrap = document.createElement("div");
    wrap.className = "diagram-menu";
    screen.menu.forEach((m) => {
      const btn = document.createElement("button");
      btn.type = "button";
      btn.className = "diagram-menu-btn";
      btn.textContent = m.label;
      btn.addEventListener("click", () => {
        diagramState.stack.push(m.go);
        renderDiagram();
      });
      wrap.appendChild(btn);
    });
    body.innerHTML = "";
    body.appendChild(wrap);
    return;
  }

  body.innerHTML = `<div class="diagram-imgwrap"><img src="${screen.src}" alt="${screen.alt}"><div class="diagram-dots" id="diagram-dots"></div></div>`;
  if (screen.altGo) {
    const altBtn = document.createElement("button");
    altBtn.type = "button";
    altBtn.className = "diagram-altgo";
    altBtn.textContent = screen.altGo.label;
    altBtn.addEventListener("click", () => {
      diagramState.stack.push(screen.altGo.go);
      renderDiagram();
    });
    body.appendChild(altBtn);
  }

  const dotsEl = document.getElementById("diagram-dots");
  const addDot = (left, top, text, onClick) => {
    const d = document.createElement("button");
    d.type = "button";
    d.className = "diagram-dot";
    d.style.left = left;
    d.style.top = top;
    d.textContent = text;
    d.addEventListener("click", onClick);
    dotsEl.appendChild(d);
  };

  (screen.zones || []).forEach((z) => {
    addDot(z.left, z.top, z.label, () => {
      if (z.go) { diagramState.stack.push(z.go); renderDiagram(); }
      else { diagramResolveZoneCategory(z); }
    });
  });
  (screen.wheels || []).forEach((w) => {
    addDot(w.left, w.top, String(w.num), () => diagramResolveWheel(w));
  });
  (screen.parts || []).forEach((p) => {
    addDot(p.left, p.top, p.label, () => diagramResolvePart(p));
  });
}

document.getElementById("diagram-back").addEventListener("click", () => {
  if (diagramState.stack.length > 1) { diagramState.stack.pop(); renderDiagram(); }
});

});

// Direct feedback, 2026-09-09: "report can start with rem blong, but
// somehow we need to categorize failure modes." Typing a description
// (debounced -- one call per pause in typing, not per keystroke) asks
// mekanik-api's classify_failure_mode to suggest the matching Jenis
// kerusakan entry and auto-selects it. Still just a suggestion --
// the dropdown stays a normal, fully manual-editable select, and the
// hint text says so explicitly so a mechanic doesn't mistake this for
// something locked in. A blank/failed classification silently leaves
// the dropdown at whatever it already was (its own default, or a
// mechanic's prior manual pick) -- never blocks or resets the form.
function wireFailureModeSuggest(descId, selId, hintId) {
  const descEl = document.getElementById(descId);
  const selEl = document.getElementById(selId);
  const hintEl = document.getElementById(hintId);
  if (!descEl || !selEl) return;
  let timer = null;
  descEl.addEventListener("input", () => {
    if (timer) clearTimeout(timer);
    const text = descEl.value.trim();
    if (text.length < 4) { if (hintEl) hintEl.textContent = ""; return; }
    timer = setTimeout(async () => {
      try {
        const { failure_mode_id, confidence } = await call("classify_failure_mode", { description: text });
        if (!failure_mode_id || confidence === "none") { if (hintEl) hintEl.textContent = ""; return; }
        const match = catalogs.failureModes.find((f) => f.id === failure_mode_id);
        if (!match) return;
        selEl.value = failure_mode_id;
        if (hintEl) hintEl.textContent = "🤖 Terdeteksi: " + match.name + " -- ubah di atas jika salah";
      } catch (e) {
        // Silent -- a failed suggestion never blocks manual selection.
      }
    }, 800);
  });
}
wireFailureModeSuggest("f-description", "f-failure-mode", "f-fm-hint");

document.getElementById("btn-create").addEventListener("click", async () => {
  const btn = document.getElementById("btn-create");
  btn.disabled = true;
  try {
    await call("create_repair", {
      truck_id: document.getElementById("f-truck").value,
      location: document.getElementById("f-location").value,
      failure_mode_id: document.getElementById("f-failure-mode").value,
      description: document.getElementById("f-description").value,
      wheel_position: diagramState.wheelPosition || null,
      component_position: diagramState.componentPosition || null,
    });
    document.getElementById("f-description").value = "";
    toast("Laporan servis disimpan.");
    if (tg && tg.HapticFeedback) tg.HapticFeedback.notificationOccurred("success");
    // Reset the diagram picker for the next report -- otherwise a
    // resolved position/filter from the last report would silently
    // carry over onto one that has nothing to do with it.
    diagramState = freshDiagramState();
    diagramResetFmOptions();
    document.getElementById("diagram-summary").style.display = "none";
    document.getElementById("diagram-skip-note").style.display = "none";
    document.getElementById("diagram-picker").style.display = "block";
    renderDiagram();
  } catch (e) {
    toast("Gagal: " + e.message);
  } finally {
    btn.disabled = false;
  }
});

async function loadOpenRepairs() {
  const el = document.getElementById("list-open");
  // Preserve which cards were already expanded across a refresh (add
  // issue / update location / etc. all reload this list) -- otherwise
  // every action collapses the card you were just working in.
  const openIds = new Set(
    [...el.querySelectorAll("details.repair-card[open]")].map((d) => d.dataset.id),
  );
  el.className = "";
  el.innerHTML = "Memuat...";
  const { repairs } = await call("list_open_repairs");
  if (!repairs || repairs.length === 0) {
    el.className = "empty";
    el.innerHTML = "Tidak ada servis yang sedang berjalan.";
    return;
  }
  el.innerHTML = repairs
    .map((r) => {
      const issues = r.repair_record_issues || [];
      const issueCount = issues.length;
      const loc = r.location ? LOCATION_LABELS[r.location] || r.location : "";
      // mark_done's own server-side gate requires EVERY issue 'done' --
      // mirrored client-side so the button reads as disabled/explained
      // instead of a mechanic tapping it and just getting an error toast.
      const allDone = issueCount > 0 && issues.every((i) => i.status === "done");
      return `
      <details class="repair-card" data-id="${r.id}" ${openIds.has(r.id) ? "open" : ""}>
        <summary class="repair-summary">
          <span class="truck-id">Truk ${r.truck_id}</span>
          <span class="repair-summary-meta">Servis #${r.seq} &middot; ${issueCount} masalah${loc ? " &middot; " + loc : ""}</span>
        </summary>
        <div class="repair-body">
        <div class="card-meta">Mulai ${formatDate(r.downtime_start)}</div>
        <div class="card-section">
          <label>Lokasi</label>
          <select class="f-location">${locationOptions(r.location)}</select>
        </div>
        <div class="card-section issues-list">
          ${issues.map((i) => `<div class="issue-unit">${editableIssueRowHtml(i)}${issueActionsHtml(i)}</div>`).join("") || '<div class="issue-row">(belum ada masalah tercatat)</div>'}
        </div>
        <details class="add-issue card-section">
          <summary>+ Tambah masalah</summary>
          <label>Jenis kerusakan</label>
          <select class="new-issue-fm">${failureModeOptions()}</select>
          <div class="fm-hint new-issue-fm-hint"></div>
          <label>Deskripsi</label>
          <textarea class="new-issue-desc" placeholder="Jelaskan kerusakan yang ditemukan... (mis. &quot;rem blong&quot;)"></textarea>
          <button class="btn-add-issue">Tambah</button>
        </details>
        <div class="card-section photo-row">
          <label class="photo-btn">
            <span class="photo-btn-label">📷 Tambah Foto/Video</span>
            <input type="file" accept="image/*,video/*" capture="environment" class="photo-input" />
          </label>
          ${(() => {
            const photos = r.repair_photos || [];
            const before = photos.filter((p) => p.phase === "before").length;
            const after = photos.filter((p) => p.phase === "after").length;
            if (!before && !after) return "";
            const parts = [];
            if (before) parts.push(before + " sebelum");
            if (after) parts.push(after + " sesudah");
            return `<div class="photo-count">${parts.join(" · ")}</div>`;
          })()}
        </div>
        ${allDone
          ? `<button class="btn-done">Tandai Selesai</button>`
          : `<div class="btn-done-disabled">Selesaikan semua masalah dulu untuk menutup servis ini</div>`}
        </div>
      </details>
    `;
    })
    .join("");

  el.querySelectorAll(".f-location").forEach((sel) => {
    sel.addEventListener("change", async () => {
      const card = sel.closest(".repair-card");
      sel.disabled = true;
      try {
        await call("update_location", { id: card.dataset.id, location: sel.value });
        toast("Lokasi diperbarui.");
        if (tg && tg.HapticFeedback) tg.HapticFeedback.notificationOccurred("success");
      } catch (e) {
        toast("Gagal: " + e.message);
      } finally {
        sel.disabled = false;
      }
    });
  });

  // Same suggestion behavior as Lapor Baru's Deskripsi field (see
  // wireFailureModeSuggest), wired per-card here since "+ Tambah
  // masalah" is a repeated element, not a single fixed id.
  el.querySelectorAll(".new-issue-desc").forEach((descEl) => {
    const card = descEl.closest(".add-issue");
    const selEl = card.querySelector(".new-issue-fm");
    const hintEl = card.querySelector(".new-issue-fm-hint");
    let timer = null;
    descEl.addEventListener("input", () => {
      if (timer) clearTimeout(timer);
      const text = descEl.value.trim();
      if (text.length < 4) { hintEl.textContent = ""; return; }
      timer = setTimeout(async () => {
        try {
          const { failure_mode_id, confidence } = await call("classify_failure_mode", { description: text });
          if (!failure_mode_id || confidence === "none") { hintEl.textContent = ""; return; }
          const match = catalogs.failureModes.find((f) => f.id === failure_mode_id);
          if (!match) return;
          selEl.value = failure_mode_id;
          hintEl.textContent = "🤖 Terdeteksi: " + match.name + " -- ubah di atas jika salah";
        } catch (e) {
          // Silent -- a failed suggestion never blocks manual selection.
        }
      }, 800);
    });
  });

  el.querySelectorAll(".btn-add-issue").forEach((btn) => {
    btn.addEventListener("click", async () => {
      const card = btn.closest(".repair-card");
      const details = btn.closest(".add-issue");
      btn.disabled = true;
      try {
        await call("add_issue", {
          repair_record_id: card.dataset.id,
          failure_mode_id: card.querySelector(".new-issue-fm").value,
          description: card.querySelector(".new-issue-desc").value,
        });
        toast("Masalah ditambahkan.");
        if (tg && tg.HapticFeedback) tg.HapticFeedback.notificationOccurred("success");
        details.open = false;
        loadOpenRepairs();
      } catch (e) {
        toast("Gagal: " + e.message);
        btn.disabled = false;
      }
    });
  });

  el.querySelectorAll(".btn-request-parts").forEach((btn) => {
    btn.addEventListener("click", async () => {
      const card = btn.closest(".repair-card");
      const row = btn.closest(".issue-actions");
      const input = row.querySelector(".issue-parts-needed");
      btn.disabled = true;
      try {
        // Per-issue submit (2026-08-30, direct feedback while testing --
        // was one bulk button for the whole session; real bug found:
        // leaving a not-yet-diagnosed masalah's input blank was
        // indistinguishable from "genuinely no part needed" and wrongly
        // fast-forwarded it. request_parts' payload still accepts an
        // array -- this just always sends a single-item one now.
        await call("request_parts", {
          repair_record_id: card.dataset.id,
          issues: [{ id: row.dataset.issueId, parts_used: input.value }],
        });
        toast("Permintaan suku cadang diajukan.");
        if (tg && tg.HapticFeedback) tg.HapticFeedback.notificationOccurred("success");
        loadOpenRepairs();
      } catch (e) {
        toast("Gagal: " + e.message);
        btn.disabled = false;
      }
    });
  });

  el.querySelectorAll(".btn-start-progress").forEach((btn) => {
    btn.addEventListener("click", async () => {
      const row = btn.closest(".issue-actions");
      btn.disabled = true;
      try {
        await call("start_progress_from_vendor", { id: row.dataset.issueId });
        toast("Perbaikan dimulai.");
        if (tg && tg.HapticFeedback) tg.HapticFeedback.notificationOccurred("success");
        loadOpenRepairs();
      } catch (e) {
        toast("Gagal: " + e.message);
        btn.disabled = false;
      }
    });
  });

  el.querySelectorAll(".btn-issue-done").forEach((btn) => {
    btn.addEventListener("click", async () => {
      const row = btn.closest(".issue-actions");
      btn.disabled = true;
      try {
        await call("mark_issue_done", { id: row.dataset.issueId });
        toast("Masalah ditandai selesai.");
        if (tg && tg.HapticFeedback) tg.HapticFeedback.notificationOccurred("success");
        loadOpenRepairs();
      } catch (e) {
        toast("Gagal: " + e.message);
        btn.disabled = false;
      }
    });
  });

  // Checklist C2, 2026-08-31. Downscales client-side before upload --
  // a raw phone-camera photo is several MB, way over what should go
  // through a base64 JSON payload; capped to 1600px on the long edge,
  // JPEG quality 0.8, which is plenty for a documentation photo.
  // Phase (before/after) is no longer picked here -- mekanik-api computes
  // it server-side from whether every masalah is already 'done' (direct
  // feedback, 2026-08-31). This button just uploads; media_type tells
  // the server photo vs video.
  el.querySelectorAll(".photo-input").forEach((input) => {
    input.addEventListener("change", async () => {
      const file = input.files && input.files[0];
      if (!file) return;
      const card = input.closest(".repair-card");
      const labelText = input.closest(".photo-btn").querySelector(".photo-btn-label");
      const originalText = labelText.textContent;
      const isVideo = file.type.startsWith("video/");

      if (isVideo && file.size > MAX_VIDEO_BYTES) {
        toast(`Video terlalu besar (maks ${MAX_VIDEO_BYTES / 1024 / 1024}MB). Ambil video lebih pendek.`);
        input.value = "";
        return;
      }

      labelText.textContent = "Mengunggah...";
      try {
        // Videos go up as-is (canvas resize only works on images);
        // photos get downscaled the same way as before.
        const base64 = isVideo ? await fileToBase64(file) : await resizeImageToBase64(file, 1600, 0.8);
        await call("upload_photo", {
          repair_record_id: card.dataset.id,
          media_type: isVideo ? "video" : "photo",
          filename: file.name || (isVideo ? "video.mp4" : "photo.jpg"),
          content_base64: base64,
        });
        toast("Berhasil diunggah.");
        if (tg && tg.HapticFeedback) tg.HapticFeedback.notificationOccurred("success");
        loadOpenRepairs();
      } catch (e) {
        toast("Gagal unggah: " + e.message);
        labelText.textContent = originalText;
      } finally {
        input.value = "";
      }
    });
  });

  el.querySelectorAll(".btn-save-issue").forEach((btn) => {
    btn.addEventListener("click", async (ev) => {
      ev.preventDefault();
      const details = btn.closest(".issue-edit");
      btn.disabled = true;
      try {
        await call("update_issue", {
          id: details.dataset.issueId,
          failure_mode_id: details.querySelector(".edit-issue-fm").value,
          description: details.querySelector(".edit-issue-desc").value,
        });
        toast("Perubahan disimpan.");
        if (tg && tg.HapticFeedback) tg.HapticFeedback.notificationOccurred("success");
        loadOpenRepairs();
      } catch (e) {
        toast("Gagal: " + e.message);
        btn.disabled = false;
      }
    });
  });

  el.querySelectorAll(".btn-delete-issue").forEach((btn) => {
    btn.addEventListener("click", async (ev) => {
      ev.preventDefault();
      const details = btn.closest(".issue-edit");
      const confirmed = tg && tg.showConfirm
        ? await new Promise((resolve) => tg.showConfirm("Hapus masalah ini?", resolve))
        : confirm("Hapus masalah ini?");
      if (!confirmed) return;
      btn.disabled = true;
      try {
        await call("delete_issue", { id: details.dataset.issueId });
        toast("Masalah dihapus.");
        if (tg && tg.HapticFeedback) tg.HapticFeedback.notificationOccurred("success");
        loadOpenRepairs();
      } catch (e) {
        toast("Gagal: " + e.message);
        btn.disabled = false;
      }
    });
  });

  el.querySelectorAll(".btn-done").forEach((btn) => {
    btn.addEventListener("click", async () => {
      const card = btn.closest(".repair-card");
      btn.disabled = true;
      try {
        await call("mark_done", { id: card.dataset.id });
        toast("Ditandai selesai, menunggu sign-off.");
        if (tg && tg.HapticFeedback) tg.HapticFeedback.notificationOccurred("success");
        loadOpenRepairs();
      } catch (e) {
        toast("Gagal: " + e.message);
        btn.disabled = false;
      }
    });
  });
}

async function loadPendingSignoff() {
  const el = document.getElementById("list-signoff");
  el.className = "";
  el.innerHTML = "Memuat...";
  const { repairs } = await call("list_pending_signoff");
  if (!repairs || repairs.length === 0) {
    el.className = "empty";
    el.innerHTML = "Tidak ada servis menunggu sign-off.";
    return;
  }
  el.innerHTML = repairs
    .map((r) => {
      const issues = r.repair_record_issues || [];
      return `
      <div class="card" data-id="${r.id}">
        <div class="card-title"><span class="truck-id">Truk ${r.truck_id}</span></div>
        <div class="card-meta">Servis #${r.seq} &middot; Mulai ${formatDate(r.downtime_start)}</div>
        <div class="card-section issues-list">
          ${issues.map(issueRowHtml).join("") || '<div class="issue-row">(belum ada masalah tercatat)</div>'}
        </div>
        <div class="card-total card-section">
          ${r.location ? LOCATION_LABELS[r.location] || r.location : ""}
          ${r.mechanics ? " -- oleh " + r.mechanics.name : ""}
        </div>
        <button class="btn-signoff">Konfirmasi Selesai (Sign-off)</button>
      </div>
    `;
    })
    .join("");

  el.querySelectorAll(".btn-signoff").forEach((btn) => {
    btn.addEventListener("click", async () => {
      const card = btn.closest(".card");
      btn.disabled = true;
      try {
        await call("sign_off", { id: card.dataset.id });
        toast("Sign-off tercatat.");
        if (tg && tg.HapticFeedback) tg.HapticFeedback.notificationOccurred("success");
        loadPendingSignoff();
      } catch (e) {
        toast("Gagal: " + e.message);
        btn.disabled = false;
      }
    });
  });
}

document.querySelectorAll(".tab").forEach((tab) => {
  tab.addEventListener("click", () => setScreen(tab.dataset.screen));
});

(async function init() {
  if (!tg) {
    document.getElementById("notTelegram").style.display = "block";
    return;
  }
  tg.ready();
  tg.expand();
  document.getElementById("app").style.display = "block";
  const greetName = tg.initDataUnsafe?.user?.first_name;
  document.getElementById("mechanicName").textContent = greetName ? "Halo, " + greetName : "";
  try {
    await loadCatalogs();
  } catch (e) {
    toast("Gagal memuat data: " + e.message);
  }
  renderDiagram();
})();
</script>
</body>
</html>
